apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: marblo-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        # CPU and Memory allocation
        run.googleapis.com/cpu: "1"
        run.googleapis.com/memory: "2Gi"
        # Autoscaling settings
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # VPC connector for database access
        run.googleapis.com/vpc-access-connector: projects/YOUR_PROJECT_ID/locations/YOUR_REGION/connectors/marblo-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      serviceAccountName: marblo-service-account@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/marblo-backend:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: sentry-dsn
            - name: TOSS_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: toss-client-key
            - name: TOSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: toss-secret-key
            - name: TOSS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: toss-webhook-secret
            - name: NAVERPAY_MERCHANT_ID
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: naverpay-merchant-id
            - name: NAVERPAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: naverpay-api-key
            - name: NAVERPAY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: naverpay-secret-key
            - name: NAVERPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: naverpay-webhook-secret
            - name: CORS_ORIGINS
              value: '["https://your-domain.com"]'
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "0.5"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
