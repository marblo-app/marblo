appId: com.marblo.app
productName: Marblo
directories:
  output: dist
  buildResources: resources
files:
  - "dist-electron/**/*"
  - "dist/**/*"
  - "skills/**/*"
  - "package.json"

# Extra resources are copied into Resources/ next to the asar (NOT into the asar).
# The bundle-installer reads these at runtime via process.resourcesPath to seed
# ~/.claude/{commands,skills} and register the Marblo MCP entry script.
extraResources:
  - from: "../.claude/commands"
    to: "bundled-harness/commands"
    filter:
      - "tf-*.md"
  - from: "../.claude/skills"
    to: "bundled-harness/skills"
    filter:
      - "tf-*/**/*"
  - from: "dist-mcp"
    to: "dist-mcp"
    filter:
      - "**/*"

afterSign: scripts/notarize.js

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

win:
  target:
    - nsis
  # Use the 1024x1024 PNG, not resources/icon.ico (which is only 16x16 and trips
  # electron-builder's "icon must be at least 256x256" / ERR_ICON_TOO_SMALL guard
  # for the nsis target). electron-builder generates a correct multi-size .ico
  # from a >=256px PNG.
  icon: resources/icon.png
  signingHashAlgorithms:
    - sha256

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

publish:
  provider: github

extraMetadata:
  main: dist-electron/main.js
