appId: com.marblo.app
productName: Marblo
directories:
  output: dist
  buildResources: resources
files:
  - "dist-electron/**/*"
  - "dist/**/*"
  - "skills/**/*"
  - "package.json"

# Extra resources are copied into Resources/ next to the asar (NOT into the asar).
# The bundle-installer reads these at runtime via process.resourcesPath to seed
# ~/.claude/{commands,skills} and register the Marblo MCP entry script.
extraResources:
  - from: "../.claude/commands"
    to: "bundled-harness/commands"
    filter:
      - "tf-*.md"
  - from: "../.claude/skills"
    to: "bundled-harness/skills"
    filter:
      - "tf-*/**/*"
  - from: "dist-mcp"
    to: "dist-mcp"
    filter:
      - "**/*"
  # Google 로그인 loopback OAuth config (client id + secret only). Written by
  # scripts/write-oauth-config.mjs at the tail of build:electron. main reads it
  # from process.resourcesPath at boot when app.isPackaged. Ticket QvaYPAjA.
  - from: "build-resources/oauth-config.json"
    to: "oauth-config.json"
  # 공개 Firebase Web config. dist-mcp 옆(Resources/dist-mcp/)에 놓아 번들된
  # index.js 가 import.meta.url 기준 sibling 으로 self-load 한다. 패키지 앱의
  # marblo MCP child 프로세스 env 엔 Firebase 설정이 없어(dev 만 .env/vite)
  # 이 파일이 없으면 getAuth 가 auth/invalid-api-key 로 크래시→-32000.
  # scripts/write-firebase-config.mjs 가 생성(gitignore). 티켓 MRJKgyJ4C1qPhj2Ui3vJ.
  - from: "build-resources/firebase-config.json"
    to: "dist-mcp/firebase-config.json"

afterSign: scripts/notarize.js

mac:
  # arm64 전용. universal(x64+arm64) 은 @electron/universal 병합 단계가
  # "Detected unique file ... not covered by allowList" 로 실패해 .dmg 가 산출되지
  # 않는다. 다운로드 페이지도 이미 Marblo-<ver>-arm64.dmg 패턴을 가리키고 있어
  # arm64 단일 아키가 배포 현실과 일치한다. Intel 지원은 별도 트랙(추후 allowList
  # 보정 또는 x64 개별 빌드)으로 분리한다.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Disable electron-builder's BUILT-IN notarization. electron-builder 25.x
  # auto-notarizes whenever APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # are present. We already notarize once via the afterSign hook
  # (scripts/notarize.js), so leaving this enabled caused a DOUBLE notarytool
  # submit: the built-in path's second submit stalled in Apple's backlog while
  # electron-builder blocked on it, so the .dmg was never produced. Single-source
  # notarization through the afterSign hook (which also handles PR-skip and the
  # graceful missing-credential case). notarytool submit must run exactly once.
  notarize: false

win:
  target:
    - nsis
  # Point at the 1024x1024 PNG and let electron-builder derive a correct
  # multi-size .ico from it. resources/icon.ico is now a valid >=256 multi-size
  # frame set (16..256), so switching win.icon to it would also satisfy the nsis
  # "icon must be at least 256x256" / ERR_ICON_TOO_SMALL guard — but deriving
  # from the >=256px PNG is the simplest path and needs no ImageMagick.
  icon: resources/icon.png
  # electron-builder 25 moved win.sign / signingHashAlgorithms under
  # win.signtoolOptions (the old top-level fields warn as deprecated).
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    # Build-during-sign hook (EV USB token). No-op unless WIN_SIGN=1, so CI/local
    # builds without the token stay unsigned exactly as before. Signing here (not
    # after the build) keeps latest.yml/.blockmap hashes matching the signed exe
    # so electron-updater doesn't break. See docs/signing_runbook.md §6-2.
    sign: ./scripts/win-sign.js

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Hyphenated, space-free name so the on-disk file matches the `url`/`path`
  # electron-builder writes into latest.yml ("Marblo-Setup-<ver>.exe"). With the
  # default name ("Marblo Setup <ver>.exe") a manual `gh release upload` lets
  # GitHub rewrite the spaces, breaking the updater's filename lookup (404).
  artifactName: ${productName}-Setup-${version}.${ext}

publish:
  provider: github
  # 소스 레포(melocream/marblo)는 private → 릴리스 자산을 익명 다운로드 불가.
  # 공개 배포는 별도 public 레포 melocream/marblo-releases 로 발행한다.
  # (electron-updater 자동 업데이트도 이 공개 레포에서 latest-mac.yml 을 읽는다.)
  owner: melocream
  repo: marblo-releases

extraMetadata:
  main: dist-electron/main.js
