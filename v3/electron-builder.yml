appId: com.marblo.app
productName: Marblo
directories:
  output: dist
  buildResources: resources
files:
  - "dist-electron/**/*"
  - "dist/**/*"
  - "skills/**/*"
  - "package.json"

# Extra resources are copied into Resources/ next to the asar (NOT into the asar).
# The bundle-installer reads these at runtime via process.resourcesPath to seed
# ~/.claude/{commands,skills} and register the Marblo MCP entry script.
extraResources:
  - from: "../.claude/commands"
    to: "bundled-harness/commands"
    filter:
      - "tf-*.md"
  - from: "../.claude/skills"
    to: "bundled-harness/skills"
    filter:
      - "tf-*/**/*"
  - from: "dist-mcp"
    to: "dist-mcp"
    filter:
      - "**/*"

afterSign: scripts/notarize.js

mac:
  # Universal (x64 + arm64 merged via lipo) so a single DMG/zip runs natively on
  # BOTH Intel and Apple Silicon Macs. Previously we shipped arm64-only, which
  # Intel users could not launch (M5). Universal keeps latest-mac.yml + .blockmap
  # single-arch, so electron-updater stays intact — unlike building x64 and arm64
  # separately, where two latest-mac.yml can overwrite each other and break auto
  # update. Tradeoff: ~2x build time and bundle size. P0-7 runs the signed build.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Disable electron-builder's BUILT-IN notarization. electron-builder 25.x
  # auto-notarizes whenever APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # are present. We already notarize once via the afterSign hook
  # (scripts/notarize.js), so leaving this enabled caused a DOUBLE notarytool
  # submit: the built-in path's second submit stalled in Apple's backlog while
  # electron-builder blocked on it, so the .dmg was never produced. Single-source
  # notarization through the afterSign hook (which also handles PR-skip and the
  # graceful missing-credential case). notarytool submit must run exactly once.
  notarize: false

win:
  target:
    - nsis
  # Use the 1024x1024 PNG, not resources/icon.ico (which is only 16x16 and trips
  # electron-builder's "icon must be at least 256x256" / ERR_ICON_TOO_SMALL guard
  # for the nsis target). electron-builder generates a correct multi-size .ico
  # from a >=256px PNG.
  icon: resources/icon.png
  signingHashAlgorithms:
    - sha256
  # Build-during-sign hook (KoreaSSL EV USB token). No-op unless WIN_SIGN=1, so
  # CI/local builds without the token stay unsigned exactly as before. Signing
  # here (not after the build) keeps latest.yml/.blockmap hashes matching the
  # signed exe so electron-updater doesn't break. See docs/signing_runbook.md §6-2.
  sign: ./scripts/win-sign.js

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  # 소스 레포(melocream/marblo)는 private → 릴리스 자산을 익명 다운로드 불가.
  # 공개 배포는 별도 public 레포 melocream/marblo-releases 로 발행한다.
  # (electron-updater 자동 업데이트도 이 공개 레포에서 latest-mac.yml 을 읽는다.)
  owner: melocream
  repo: marblo-releases

extraMetadata:
  main: dist-electron/main.js
