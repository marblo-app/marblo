      <rect x="72" y="668" width="1088" height="40" rx="8" fill="#1f2937" fill-opacity="0.4" stroke="#1f2937"/>
      <text x="92" y="693" fill="#6b7280" font-size="12">▸</text>
      <text x="116" y="693" fill="#f3f4f6" font-size="12.5">Unit tests for log masking</text>
      <text x="840" y="693" fill="#9ca3af" font-size="11">claude</text>
      <rect x="948" y="680" width="44" height="16" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
      <text x="970" y="692" fill="#c4b5fd" font-size="10" font-weight="500" text-anchor="middle">report</text>
