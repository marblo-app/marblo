      <text x="116" y="301" fill="#f3f4f6" font-size="12.5">Auth API — JWT refresh rotation</text>
      <text x="840" y="301" fill="#9ca3af" font-size="11">claude</text>
      <rect x="896" y="288" width="40" height="16" rx="8" fill="#a855f7" fill-opacity="0.15"/>
      <text x="916" y="300" fill="#d8b4fe" font-size="10" font-weight="500" text-anchor="middle">PR</text>
