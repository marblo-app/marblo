      <text x="840" y="645" fill="#9ca3af" font-size="11">claude</text>
      <rect x="896" y="632" width="40" height="16" rx="8" fill="#a855f7" fill-opacity="0.15"/>
      <text x="916" y="644" fill="#d8b4fe" font-size="10" font-weight="500" text-anchor="middle">PR</text>
      <rect x="948" y="632" width="44" height="16" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
