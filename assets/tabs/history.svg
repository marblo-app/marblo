      <text x="1144" y="301" fill="#6b7280" font-size="11" text-anchor="end">1h ago</text>

      <line x1="92" y1="316" x2="1140" y2="316" stroke="#374151" stroke-opacity="0.7"/>

      <g font-size="11.5">
        <text x="116" y="342" fill="#6b7280" font-weight="500">Problem</text>
        <text x="196" y="342" fill="#d1d5db">A reused refresh token was never invalidated, so a stolen one could be renewed forever.</text>

        <text x="116" y="370" fill="#6b7280" font-weight="500">Approach</text>
        <text x="196" y="370" fill="#d1d5db">Rotate the token on every use and revoke the previous jti immediately. A reused token dies.</text>

        <text x="116" y="398" fill="#6b7280" font-weight="500">Changes</text>
        <text x="196" y="398" fill="#d1d5db">src/api/auth.ts · src/api/session.ts · tests/auth.e2e.ts (3 files, +128 / −46)</text>

        <text x="116" y="426" fill="#6b7280" font-weight="500">Verification</text>
        <text x="196" y="426" fill="#d1d5db">12 unit + 4 e2e passing · tsc clean · reused token returns 401, checked by hand</text>
      </g>

      <g font-size="11.5">
        <text x="116" y="466" fill="#60a5fa">Open PR ↗</text>
        <text x="196" y="466" fill="#60a5fa">View ticket</text>
        <rect x="272" y="454" width="112" height="18" rx="4" fill="#111827" stroke="#374151"/>
        <text x="328" y="467" class="mono" fill="#d1d5db" font-size="10.5" text-anchor="middle">diff (a1b2c3d)</text>
        <rect x="396" y="454" width="60" height="18" rx="9" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3"/>
        <text x="426" y="467" fill="#fcd34d" font-size="10.5" font-weight="500" text-anchor="middle">🤖 auto</text>
        <text x="472" y="467" fill="#6b7280" font-size="10.5">Orchestrator squash-merged · wt/auth-api → main</text>
      </g>

      <g font-size="10.5">
        <text x="116" y="496" fill="#6b7280">Cost</text>
        <text x="196" y="496" class="mono" fill="#a6adc8">claude-opus-5 · 184K tok · $2.31 · 42m</text>
        <text x="1140" y="496" fill="#6b7280" text-anchor="end">The record survives even if the ticket is deleted (append-only)</text>
      </g>
    </g>

    <!-- ── row 4 (collapsed) ── -->
