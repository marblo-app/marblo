<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="History — An append-only ledger of the fleet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
