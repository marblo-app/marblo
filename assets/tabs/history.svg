      <text x="114" y="157" fill="#d1d5db">All</text>
      <path d="M180 151 l4 4 l4 -4" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
      <rect x="210" y="142" width="96" height="22" rx="5" fill="#1f2937" stroke="#374151"/>
