    <rect x="500" y="18" width="200" height="28" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="540" y="37" fill="#e5e7eb" font-size="13" font-weight="600">my-app</text>
    <path d="M676 29 l4 4 l4 -4" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="710" y="22" width="46" height="20" rx="10" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="733" y="36" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">FREE</text>
    <circle cx="1168" cy="32" r="12" fill="#3b82f6"/><text x="1168" y="36" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">D</text>

    <!-- tab bar (Code active) -->
    <rect x="8" y="56" width="1184" height="36" fill="#0d1420"/>
    <line x1="8" y1="92" x2="1192" y2="92" stroke="#374151"/>
    <g font-size="12.5" font-weight="600" fill="#9ca3af">
      <text x="40" y="78">Guide</text>
      <text x="97" y="78">Board</text>
      <text x="154" y="78">Lanes</text>
      <text x="211" y="78">Missions</text>
      <text x="289" y="78" fill="#60a5fa">Code</text>
      <text x="339" y="78">Agents</text>
      <text x="403" y="78">Usage</text>
      <text x="460" y="78">Worktrees</text>
      <text x="545" y="78">History</text>
    </g>
    <rect x="283" y="90" width="40" height="2" fill="#3b82f6"/>

    <!-- Root (worktree) selector bar -->
    <rect x="8" y="92" width="1184" height="36" fill="#1f2937"/>
    <line x1="8" y1="128" x2="1192" y2="128" stroke="#374151"/>
    <text x="28" y="115" fill="#9ca3af" font-size="11" font-weight="600">Root</text>
    <rect x="66" y="99" width="560" height="22" rx="4" fill="#1f2937" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="78" y="114" class="mono" fill="#e5e7eb" font-size="11">NUISs7fI · wt/auth-api · ~/dev/my-app/../wt/auth-api</text>
    <path d="M606 108 l4 4 l4 -4" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="642" y="115" fill="#6b7280" font-size="11">12 archived worktrees hidden</text>
    <text x="1176" y="115" fill="#6b7280" font-size="11" text-anchor="end">4 agents, each working in a different root</text>

    <!-- editor tabs -->
    <rect x="8" y="128" width="1184" height="34" fill="#111827"/>
    <line x1="8" y1="162" x2="1192" y2="162" stroke="#374151"/>
    <rect x="20" y="130" width="188" height="32" fill="#1f2937"/>
    <rect x="20" y="130" width="188" height="2" fill="#3b82f6"/>
    <text x="34" y="151" class="mono" fill="#e5e7eb" font-size="11.5">src/api/auth.ts</text>
    <text x="188" y="151" fill="#6b7280" font-size="12">✕</text>
    <text x="228" y="151" class="mono" fill="#9ca3af" font-size="11.5">tests/auth.e2e.ts</text>
    <text x="372" y="151" fill="#4b5563" font-size="12">✕</text>
    <text x="410" y="151" class="mono" fill="#9ca3af" font-size="11.5">src/api/session.ts</text>
    <text x="562" y="151" fill="#4b5563" font-size="12">✕</text>
    <rect x="1074" y="134" width="104" height="24" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.45"/>
    <text x="1126" y="150" fill="#93c5fd" font-size="11.5" font-weight="600" text-anchor="middle">View diff</text>

    <!-- changed-file strip (WorktreeDiffBanner) -->
    <rect x="8" y="162" width="1184" height="34" fill="#1e3a8a" fill-opacity="0.16"/>
    <line x1="8" y1="196" x2="1192" y2="196" stroke="#374151" stroke-opacity="0.7"/>
    <circle cx="30" cy="179" r="6" fill="none" stroke="#93c5fd" stroke-width="1.4"/><path d="M30 176 v3 l2 2" stroke="#93c5fd" stroke-width="1.3" fill="none"/>
    <text x="46" y="184" fill="#bfdbfe" font-size="11.5">Opened 3 changed files in wt/auth-api · against base main</text>
    <text x="1176" y="184" class="mono" fill="#93c5fd" font-size="11" text-anchor="end">▲3 ▼0 · no conflicts</text>

    <!-- diff summary -->
    <text x="72" y="228" fill="#9ca3af" font-size="12">3 files changed</text>
    <text x="176" y="228" class="mono" fill="#6ee7b7" font-size="12">+128</text>
    <text x="220" y="228" class="mono" fill="#fca5a5" font-size="12">−46</text>
    <text x="1160" y="228" fill="#6b7280" font-size="11" text-anchor="end">Click a line to send a review comment to the orchestrator</text>

    <!-- ===== file card 1 ===== -->
    <rect x="72" y="242" width="1088" height="300" rx="6" fill="#0b1120" fill-opacity="0.7" stroke="#374151" stroke-opacity="0.6"/>
    <rect x="72" y="242" width="1088" height="32" rx="6" fill="#111827"/>
    <rect x="72" y="266" width="1088" height="8" fill="#111827"/>
    <line x1="72" y1="274" x2="1160" y2="274" stroke="#374151" stroke-opacity="0.6"/>
    <text x="88" y="263" fill="#6b7280" font-size="11">▾</text>
    <text x="106" y="263" class="mono" fill="#e5e7eb" font-size="11.5">src/api/auth.ts</text>
    <text x="1084" y="263" class="mono" fill="#6ee7b7" font-size="11" text-anchor="end">+41</text>
    <text x="1140" y="263" class="mono" fill="#fca5a5" font-size="11" text-anchor="end">−12</text>

    <g class="mono" font-size="11.5" xml:space="preserve">
      <rect x="72" y="282" width="1088" height="18" fill="#3b82f6" fill-opacity="0.1"/>
      <text x="88" y="295" fill="#bfdbfe">@@ -84,7 +84,18 @@ export async function refresh(req: Request) {</text>

      <text x="88" y="313" fill="#9ca3af">   const token = readRefreshCookie(req);</text>
      <text x="88" y="331" fill="#9ca3af">   if (!token) return unauthorized();</text>

      <rect x="72" y="336" width="1088" height="18" fill="#ef4444" fill-opacity="0.1"/>
      <text x="88" y="349" fill="#fecaca">-  const claims = verify(token, SECRET);</text>
      <rect x="72" y="354" width="1088" height="18" fill="#ef4444" fill-opacity="0.1"/>
      <text x="88" y="367" fill="#fecaca">-  return issueAccessToken(claims.sub);</text>

      <rect x="72" y="372" width="1088" height="18" fill="#10b981" fill-opacity="0.1"/>
      <text x="88" y="385" fill="#a7f3d0">+  const claims = verify(token, SECRET, { clockTolerance: 5 });</text>
      <rect x="72" y="390" width="1088" height="18" fill="#10b981" fill-opacity="0.1"/>
      <text x="88" y="403" fill="#a7f3d0">+  // rotate on every use — a replayed refresh token is now dead</text>
      <rect x="72" y="408" width="1088" height="18" fill="#10b981" fill-opacity="0.1"/>
      <text x="88" y="421" fill="#a7f3d0">+  await revokeRefreshToken(claims.jti);</text>
      <rect x="72" y="426" width="1088" height="18" fill="#10b981" fill-opacity="0.1"/>
      <text x="88" y="439" fill="#a7f3d0">+  const next = await issueRefreshToken(claims.sub);</text>
      <rect x="72" y="444" width="1088" height="18" fill="#10b981" fill-opacity="0.1"/>
      <text x="88" y="457" fill="#a7f3d0">+  setRefreshCookie(res, next);</text>
      <rect x="72" y="462" width="1088" height="18" fill="#10b981" fill-opacity="0.1"/>
      <text x="88" y="475" fill="#a7f3d0">+</text>
      <rect x="72" y="480" width="1088" height="18" fill="#10b981" fill-opacity="0.1"/>
      <text x="88" y="493" fill="#a7f3d0">+  return issueAccessToken(claims.sub, { ttl: ACCESS_TTL });</text>

      <text x="88" y="511" fill="#9ca3af"> }</text>
      <text x="88" y="529" fill="#9ca3af"> </text>
    </g>

    <!-- inline review comment routed to the orchestrator -->
    <rect x="560" y="392" width="392" height="76" rx="8" fill="#1f2937" stroke="#3b82f6" stroke-opacity="0.55"/>
    <path d="M560 420 l-12 8 l12 8 z" fill="#1f2937" stroke="#3b82f6" stroke-opacity="0.55"/>
    <circle cx="580" cy="412" r="7" fill="#3b82f6"/><text x="580" y="416" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">D</text>
    <text x="596" y="416" fill="#e5e7eb" font-size="11.5" font-weight="600">Review comment</text>
    <text x="700" y="416" class="mono" fill="#6b7280" font-size="10">src/api/auth.ts:97</text>
    <text x="580" y="436" fill="#d1d5db" font-size="11.5">What rolls back if revoke fails? Wrap it in a transaction.</text>
    <rect x="580" y="444" width="128" height="18" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="590" y="457" fill="#93c5fd" font-size="10">→ sent to the orchestrator</text>

    <!-- ===== file card 2 (collapsed) ===== -->
    <rect x="72" y="556" width="1088" height="34" rx="6" fill="#111827" stroke="#374151" stroke-opacity="0.6"/>
    <text x="88" y="578" fill="#6b7280" font-size="11">▸</text>
    <text x="106" y="578" class="mono" fill="#e5e7eb" font-size="11.5">tests/auth.e2e.ts</text>
    <text x="1084" y="578" class="mono" fill="#6ee7b7" font-size="11" text-anchor="end">+74</text>
    <text x="1140" y="578" class="mono" fill="#fca5a5" font-size="11" text-anchor="end">−4</text>

    <rect x="72" y="600" width="1088" height="34" rx="6" fill="#111827" stroke="#374151" stroke-opacity="0.6"/>
    <text x="88" y="622" fill="#6b7280" font-size="11">▸</text>
    <text x="106" y="622" class="mono" fill="#e5e7eb" font-size="11.5">src/api/session.ts</text>
    <text x="1084" y="622" class="mono" fill="#6ee7b7" font-size="11" text-anchor="end">+13</text>
    <text x="1140" y="622" class="mono" fill="#fca5a5" font-size="11" text-anchor="end">−30</text>

    <!-- footer actions -->
    <rect x="72" y="656" width="1088" height="56" rx="8" fill="#0d1420" stroke="#374151" stroke-opacity="0.6"/>
    <circle cx="98" cy="684" r="5" fill="#4ade80"/>
    <text x="114" y="688" fill="#d1d5db" font-size="12">Mergeable · not behind base main</text>
    <rect x="880" y="670" width="124" height="28" rx="7" fill="#1f2937" stroke="#374151"/>
    <text x="942" y="688" fill="#d1d5db" font-size="12" font-weight="600" text-anchor="middle">Open terminal</text>
    <rect x="1016" y="670" width="128" height="28" rx="7" fill="#2563eb"/>
    <text x="1080" y="688" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">squash-merge</text>
