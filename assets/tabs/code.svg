      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <style> .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; } </style>

  <rect x="8" y="8" width="1184" height="744" rx="14" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <clipPath id="cd-clip"><rect x="8" y="8" width="1184" height="744" rx="14"/></clipPath>
  <g clip-path="url(#cd-clip)">

