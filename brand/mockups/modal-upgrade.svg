<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Upgrade modal mockup</title><desc id="desc">Dark upgrade required modal showing required plan, limits, and upgrade action.</desc>
  <defs><style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.xs{font-size:12px}.sm{font-size:14px}.lg{font-size:20px}.xxl{font-size:28px}.text{fill:#fff}.muted{fill:#d1d5db}.dim{fill:#9ca3af}</style><symbol id="x" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs>
  <rect width="960" height="640" fill="#000" opacity=".62"/><rect x="280" y="88" width="400" height="464" rx="8" fill="#1f2937" stroke="#374151"/><use href="#x" x="642" y="112" width="20" height="20" color="#9ca3af"/>
  <g transform="translate(310 150)"><text x="0" y="0" class="ui lg text" font-weight="800">Upgrade required</text><text x="0" y="34" class="ui sm dim">More projects requires the <tspan fill="#fff" font-weight="700">Pro</tspan> plan.</text>
    <rect x="0" y="72" width="340" height="188" rx="8" fill="#111827" stroke="#374151"/><text x="22" y="108" class="ui md text" font-weight="700">Pro plan</text><text x="22" y="146" class="ui xxl text" font-weight="800">$15/mo</text>
    <use href="#check" x="22" y="168" width="16" height="16" color="#a6e3a1"/><text x="48" y="181" class="ui sm muted">Unlimited projects</text><use href="#check" x="22" y="196" width="16" height="16" color="#a6e3a1"/><text x="48" y="209" class="ui sm muted">Unlimited agents</text><use href="#check" x="22" y="224" width="16" height="16" color="#a6e3a1"/><text x="48" y="237" class="ui sm muted">Orchestrator</text>
    <rect x="0" y="300" width="158" height="42" rx="6" fill="none" stroke="#4b5563"/><text x="79" y="326" text-anchor="middle" class="ui sm muted">Close</text><rect x="182" y="300" width="158" height="42" rx="6" fill="#2563eb"/><text x="261" y="326" text-anchor="middle" class="ui sm text" font-weight="700">Upgrade to Pro</text></g>
</svg>
