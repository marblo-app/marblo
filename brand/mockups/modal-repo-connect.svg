<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Repository connect modal mockup</title><desc id="desc">Dark repository connection modal with repository URL, clone location, GitHub connect, and actions.</desc>
  <defs><style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.xs{font-size:12px}.sm{font-size:14px}.md{font-size:16px}.lg{font-size:20px}.text{fill:#f3f4f6}.muted{fill:#d1d5db}.dim{fill:#9ca3af}</style><symbol id="x" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol></defs>
  <rect width="960" height="640" fill="#000" opacity=".62"/><rect x="230" y="52" width="500" height="536" rx="8" fill="#1f2937" stroke="#374151"/><line x1="230" y1="122" x2="730" y2="122" stroke="#374151"/>
  <text x="258" y="94" class="ui lg text" font-weight="700">Connect repository</text><use href="#x" x="692" y="78" width="18" height="18" color="#9ca3af"/>
  <g transform="translate(258 150)"><text x="0" y="0" class="ui sm muted">This project has a shared repository.</text><text x="0" y="24" class="ui sm muted">Clone it here or connect an existing local folder.</text>
    <text x="0" y="56" class="ui xs dim" font-weight="700">REPOSITORY</text><rect x="0" y="66" width="444" height="42" rx="6" fill="#111827" stroke="#374151"/><text x="14" y="92" class="mono xs muted">https://github.com/marblo/marblo-web.git</text>
    <text x="0" y="142" class="ui xs dim" font-weight="700">LOCATION</text><text x="382" y="142" class="ui xs" fill="#60a5fa">Change</text><rect x="0" y="152" width="444" height="42" rx="6" fill="#111827" stroke="#374151"/><text x="14" y="178" class="mono xs muted">~/Marblo/marblo-web</text>
    <text x="0" y="218" class="ui xs" fill="#6b7280">Private repositories may require GitHub authentication before clone.</text>
    <rect x="0" y="242" width="444" height="58" rx="6" fill="#111827" fill-opacity=".6" stroke="#374151"/><text x="16" y="276" class="ui sm" fill="#60a5fa">Connect GitHub</text>
    <text x="0" y="334" class="ui sm dim">Later</text><rect x="198" y="316" width="116" height="40" rx="6" fill="none" stroke="#4b5563"/><text x="256" y="341" text-anchor="middle" class="ui sm muted">Existing folder</text><rect x="326" y="316" width="118" height="40" rx="6" fill="#2563eb"/><text x="385" y="341" text-anchor="middle" class="ui sm" fill="#fff" font-weight="700">Clone &amp; connect</text>
  </g>
</svg>
