<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Task detail modal mockup</title><desc id="desc">Dark task detail modal with status, role, activity tabs, comments and actions.</desc>
  <defs><style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.xs{font-size:12px}.sm{font-size:14px}.md{font-size:16px}.lg{font-size:20px}.text{fill:#f3f4f6}.muted{fill:#9ca3af}.dim{fill:#6b7280}</style><symbol id="x" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol><symbol id="edit" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5M18.4 3.6a2 2 0 0 1 2.8 2.8L11.8 15H9v-2.8l9.4-8.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="terminal" viewBox="0 0 24 24"><path d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs>
  <rect width="960" height="640" fill="#000" opacity=".62"/><rect x="120" y="46" width="720" height="548" rx="8" fill="#1f2937" stroke="#374151"/><line x1="120" y1="128" x2="840" y2="128" stroke="#374151"/>
  <text x="150" y="86" class="ui lg text" font-weight="700">Actual Electron UX mockups from renderer code</text><rect x="150" y="100" width="84" height="22" rx="4" fill="#2563eb"/><text x="192" y="115" class="ui xs" fill="#fff" text-anchor="middle">IN_PROGRESS</text><rect x="246" y="100" width="72" height="22" rx="4" fill="#06b6d4" fill-opacity=".18" stroke="#0891b2"/><text x="282" y="115" class="ui xs" fill="#22d3ee" text-anchor="middle">frontend</text><text x="332" y="115" class="ui xs dim">Priority: 4</text><use href="#edit" x="772" y="72" width="18" height="18" color="#9ca3af"/><use href="#x" x="806" y="72" width="18" height="18" color="#9ca3af"/>
  <g transform="translate(150 154)"><rect width="660" height="86" rx="7" fill="#111827" fill-opacity=".4" stroke="#374151" stroke-dasharray="5 5"/><text x="330" y="50" text-anchor="middle" class="ui xs dim">+ Add description (click to edit)</text></g>
  <g transform="translate(150 264)"><text x="0" y="0" class="ui xs muted" font-weight="700">ASSIGN AGENT</text><rect x="0" y="18" width="178" height="32" rx="5" fill="#2563eb" fill-opacity=".18" stroke="#3b82f6"/><circle cx="18" cy="34" r="5" fill="#10a37f"/><text x="32" y="39" class="ui xs" fill="#60a5fa">frontend-gpt</text><rect x="114" y="24" width="52" height="16" rx="3" fill="#000" opacity=".28"/><text x="140" y="36" text-anchor="middle" class="mono xs muted">5.6-sol</text></g>
  <g transform="translate(150 340)"><rect width="300" height="38" rx="6" fill="#1d4ed8" fill-opacity=".12" stroke="#3b82f6" stroke-opacity=".35"/><use href="#terminal" x="14" y="10" width="18" height="18" color="#60a5fa"/><text x="42" y="25" class="ui sm" fill="#60a5fa">View frontend-gpt terminal</text></g>
  <g transform="translate(150 404)"><rect width="204" height="34" rx="5" fill="#111827"/><rect width="68" height="34" rx="5" fill="#374151"/><text x="34" y="22" text-anchor="middle" class="ui xs text">Comments</text><text x="102" y="22" text-anchor="middle" class="ui xs muted">Activity</text><text x="170" y="22" text-anchor="middle" class="ui xs muted">Diff</text><rect x="0" y="52" width="660" height="74" rx="7" fill="#111827" stroke="#374151"/><text x="18" y="78" class="ui xs text" font-weight="700">PM</text><text x="18" y="102" class="ui xs muted">Please keep SVG icons as paths and verify screenshots.</text><rect x="0" y="146" width="560" height="38" rx="6" fill="#111827" stroke="#4b5563"/><text x="16" y="170" class="ui xs dim">Add a comment...</text><rect x="576" y="146" width="84" height="38" rx="6" fill="#2563eb"/><text x="618" y="170" text-anchor="middle" class="ui xs" fill="#fff" font-weight="700">Send</text></g>
</svg>
