schema_version: 1

id: wshobson-legacy-modernization
name: Legacy Modernization (wshobson)
type: workflow
version: 0.1.0
status: active
description: A checkpointed strangler-fig migration pipeline — plan the replacement, migrate by feature or by layer, upgrade dependencies with breaking-change paths, and stop for approval between phases. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "레거시 현대화 (wshobson)"
    description: "체크포인트가 있는 스트랭글러 피그(strangler-fig) 마이그레이션 파이프라인 — 교체 계획 수립, 기능별·레이어별 마이그레이션, 브레이킹 체인지 경로를 포함한 의존성 업그레이드, 단계 사이 승인 대기. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/framework-migration

compatibility:
  harnesses:
    - claude-code
    - codex

permissions:
  - repository:read
  - filesystem:write
  - shell:exec

keywords:
  - migration
  - legacy
  - refactoring
  - dependencies
  - external

license: MIT
homepage: https://github.com/wshobson/agents
