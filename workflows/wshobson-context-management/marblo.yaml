schema_version: 1

id: wshobson-context-management
name: Context Save & Restore (wshobson)
type: workflow
version: 0.1.0
status: active
description: Two commands that serialise a working session — capture architecture decisions, state, and open threads to disk, then rehydrate them in a later session or a different agent. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "컨텍스트 저장·복원 (wshobson)"
    description: "작업 세션을 직렬화하는 두 개의 커맨드 — 아키텍처 결정·상태·미해결 사안을 파일로 캡처한 뒤, 이후 세션이나 다른 에이전트에서 복원. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/context-management

compatibility:
  harnesses:
    - claude-code
    - codex

permissions:
  - repository:read
  - filesystem:write
  - shell:exec

keywords:
  - context
  - handoff
  - session
  - slash-command
  - external

license: MIT
homepage: https://github.com/wshobson/agents
