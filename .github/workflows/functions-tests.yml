name: Functions Tests

# v3/functions is a SEPARATE npm project (own package.json/lockfile) from the
# v3 Electron app that build.yml/lint.yml already gate. Its node:test suites
# were never wired into any workflow — `grep -rn
# "test:marketing|test:consent-sync|test:ad-funnel" .github/workflows/*.yml`
# returned 0 hits before this file. #1522 merged with `npm run test:marketing`
# failing 3/47 assertions while lint/typecheck were green, and the web app was
# already deployed before anyone ran the suite by hand and noticed (task
# IMwzA1ZCiO5eUprKqI09).
#
# v3/functions cannot take a devDependency: Cloud Build's `npm ci` at deploy
# time dies with EUSAGE on an out-of-sync lockfile, so a test runner cannot be
# added as a devDependency there. This job runs what already exists — the
# `npm run test:*` scripts, which use only typescript (already a
# devDependency) and node's built-in `--test` runner — via
# `npm run test:ci` (scripts/run-ci-node-test-suites.mjs), which reads
# package.json live and runs every test:* script whose command does not
# invoke `firebase emulators:exec`.
#
# The 6 emulator suites (test:membership, test:reject, test:followup,
# test:survey-offer, test:consent-sync, test:google-removal-queue — #1523
# added the 6th after this file's first version, and the runtime classifier
# in run-ci-node-test-suites.mjs picked it up with zero changes here) are
# wired in as a SEPARATE `emulator-tests` job (task HV8l8Kr5LpTOVUEHS0Ou),
# not folded into `unit-tests`. Measured 2026-09-08: the 6 emulator suites
# take ~53s of actual test time (7-12s each, each pays its own `npm run
# build` + emulator boot), while `unit-tests` runs in ~2m23s on CI. Serializing
# them into one job would cost every PR ~2m23s + (setup-java + firebase-tools
# install + ~1-2min of emulator work) before the FAST, dependency-free half of
# this gate reports back — running them as sibling jobs keeps `unit-tests`'
# turnaround exactly where it was.
#
# firebase-tools is installed globally in the `emulator-tests` job, not added
# to package.json: it's a large package with its own native deps, and adding
# it as a devDependency here reproduces the exact problem this workflow
# exists around — Cloud Build's `npm ci` at deploy time dying with EUSAGE.
# Version pinned to 15.23.0 (verified working locally with JDK 21 — firebase-
# tools 15.x refuses Java below 21 with "no longer supports Java version
# before 21", confirmed on this machine's default Java 1.8).
#
# Not a required status check (unlike build.yml's `verify` / lint.yml's
# `lint`) — no repository ruleset references this job, so the `paths` filter
# below is safe and cannot leave a PR permanently unmergeable the way it would
# for a required check (see build.yml's header comment for that hazard).
on:
  push:
    branches: [main]
    paths: ["v3/functions/**"]
  pull_request:
    branches: [main]
    paths: ["v3/functions/**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # All 58 pure suites together run in well under a minute locally; this is
    # a hang guard, not a tuned budget.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v3/functions/package-lock.json

      # v3/functions' lockfile is self-contained (no macOS/win-only optional
      # deps like the root v3 lockfile), so unlike build.yml/lint.yml this can
      # use the strict `npm ci` instead of falling back to `npm install`.
      - name: Install dependencies
        working-directory: v3/functions
        run: npm ci

      - name: Run pure node:test suites
        working-directory: v3/functions
        run: npm run test:ci

  emulator-tests:
    runs-on: ubuntu-latest
    # Emulator boot + 6 suites measured at ~53s locally; this is a hang guard
    # (a stuck emulator, a port conflict), not a tuned budget.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v3/functions/package-lock.json

      # firebase-tools 15.x requires Java 21+ (older majors are rejected
      # outright: "Error: firebase-tools no longer supports Java version
      # before 21" — confirmed against this repo's default Java 1.8). Temurin
      # is Eclipse's OpenJDK distribution, the standard actions/setup-java
      # choice.
      - name: Setup Java (for the Firestore/Auth emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # v3/functions' lockfile is self-contained, so — like unit-tests above —
      # this can use the strict `npm ci` instead of falling back to `npm
      # install`.
      - name: Install dependencies
        working-directory: v3/functions
        run: npm ci

      # Global install, NOT a devDependency (see header comment). Pinned to
      # the version verified locally against JDK 21.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.23.0

      # The Firestore emulator binary is a ~132MB JAR that firebase-tools
      # downloads on first use; caching it means only the first run per cache
      # key pays that cost instead of every PR push.
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.23.0

      - name: Run emulator node:test suites
        working-directory: v3/functions
        run: npm run test:ci:emulator
