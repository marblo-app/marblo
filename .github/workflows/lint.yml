name: Lint

# Lint gate for v3. Blocks PRs (and pushes to main) when ESLint reports
# errors. exhaustive-deps and other advisory rules are configured as
# warnings in v3/eslint.config.mjs and do not fail this gate by design.
on:
  push:
    branches: [main]
    paths: ["v3/**", "docs/**", "marblo-web/docs/**"]
  pull_request:
    # NO `paths:` FILTER HERE, AND IT MUST STAY THAT WAY — `lint` is a required
    # status check in the "main rules" repository ruleset (id 22175572). A
    # required check is satisfied only by a check RUN that reports a
    # conclusion. A path filter that stops this workflow from triggering (or a
    # job-level `if:` that ends the job as SKIPPED) creates no run at all, so
    # the required check sits in "expected" forever: mergeStateStatus=BLOCKED
    # and `gh pr merge --admin` refuses with
    # `Required status check "lint" is expected`.
    #
    # The old filter was `["v3/**", "docs/**", "marblo-web/docs/**"]`, which
    # never fired for a PR touching only `.github/**` or a root-level file —
    # see #1394 (.github/workflows/merge-history.yml only), which carries no
    # `lint` check at all. It merged only because it predates the ruleset; the
    # next such PR would have been unmergeable. The saving moved down to step
    # level instead: ESLint (the only expensive part — npm install + eslint over
    # v3) runs only when non-docs `v3/**` files changed. The wiki checks are
    # plain python over the checkout, a few seconds, and always run.
    #
    # `push` keeps its filter: required checks are enforced through PRs, and a
    # push run that does not exist blocks nothing.
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    # Read-only. The scope probe below asks the API which files the PR touches.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Decide whether the ESLint half of this job has anything to check.
      # `eslint=true` unless the event is a pull_request whose changed files,
      # after dropping docs/markdown, contain nothing under `v3/`. Docs globs
      # mirror build.yml's: `**.md` → `\.md$`, `docs/**` → `^docs/`,
      # `**/docs/**` → `/docs/`. Every failure path falls back to `true` — an
      # unreadable file list must cost a few minutes, never skip the gate.
      - name: Detect changed scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "eslint=true" >> "$GITHUB_OUTPUT"
            echo "format=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull_request; running ESLint."
            echo "Prettier check is PR-diff-scoped only (v3 still has ~520"
            echo "pre-existing unformatted files as of 2026-09-05; an unscoped"
            echo "--check would fail every push), so it does not run here."
            exit 0
          fi
          if ! files_tsv=$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                -q '.[] | select(.status != "removed") | [.status, .filename, (.previous_filename // "")] | @tsv'); then
            echo "::warning::Could not list PR files; running ESLint."
            echo "eslint=true" >> "$GITHUB_OUTPUT"
            echo "format=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(printf '%s\n' "$files_tsv" | cut -f2)
          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'
          code=$(printf '%s\n' "$files" | grep -Ev '(\.md$|^docs/|/docs/)' \
                 | grep '^v3/' || true)
          if [ -n "$code" ]; then
            echo "eslint=true" >> "$GITHUB_OUTPUT"
            echo "v3 source changed; running ESLint:"
            printf '%s\n' "$code" | sed 's/^/  /'
          else
            echo "eslint=false" >> "$GITHUB_OUTPUT"
            echo "No non-docs v3 files changed: skipping npm install + ESLint."
            echo "The wiki checks below still run, so \`lint\` reports SUCCESS."
          fi

          # Prettier check: scoped to the files THIS PR changed, never the
          # whole repo, AND diffed against each file's own origin/main
          # baseline (see the "Format check" step below) so it blocks only
          # NEW drift, not the ~520 files that don't conform today. A file
          # that was already unformatted on main is pre-existing debt and is
          # skipped even if this PR touches it; a repo-wide --check would
          # turn every unrelated PR red on day one.
          fmt=$(printf '%s\n' "$files_tsv" \
                | awk -F'\t' '$2 ~ /^v3\// && $2 ~ /\.(ts|tsx|js|jsx|json|css|scss|md|mjs|cjs)$/')
          if [ -n "$fmt" ]; then
            echo "format=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$fmt" \
              | awk -F'\t' 'BEGIN{OFS="\t"} {sub(/^v3\//,"",$2); sub(/^v3\//,"",$3); print $1,$2,$3}' \
              > "$RUNNER_TEMP/prettier-files.tsv"
            echo "Prettier will check (status, path relative to v3/):"
            sed 's/^/  /' "$RUNNER_TEMP/prettier-files.tsv"
          else
            echo "format=false" >> "$GITHUB_OUTPUT"
            echo "No formattable v3 files changed: skipping Prettier check."
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.scope.outputs.eslint == 'true' || steps.scope.outputs.format == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v3/package-lock.json

      # Use `npm install` (not `npm ci`) on purpose. The committed lock is
      # generated on macOS and omits electron-builder's optional win32 subtree
      # (electron-builder-squirrel-windows, archiver, …); `npm ci` strictly
      # validates lock/package.json sync up front and fails on Linux with
      # "Missing … from lock file" before it can honor --omit=optional. The
      # lint toolchain (eslint, typescript-eslint, react-hooks) are all regular
      # devDependencies, so reconciling with `npm install --omit=optional`
      # installs exactly what lint needs without tripping the strict check.
      - name: Install dependencies
        if: steps.scope.outputs.eslint == 'true' || steps.scope.outputs.format == 'true'
        working-directory: v3
        run: npm install --no-audit --no-fund --omit=optional

      - name: Lint
        if: steps.scope.outputs.eslint == 'true'
        working-directory: v3
        run: npm run lint

      # Uses the repo-pinned binary (^3.8.3, v3/package-lock.json), never
      # `npx prettier` — npx resolves whatever version is cached/installed
      # globally, which is how v3/electron/main.ts drifted in the first place.
      #
      # Diffed against each file's origin/main baseline, not a flat --check
      # over the changed-files list. A flat --check fails the whole gate the
      # moment ANY changed file is pre-existing debt (~520/1985 files today),
      # forcing an unrelated one-line PR to carry a repo-wide reformat to
      # pass (see #1447: +54/-23 would have needed a 1,212-line main.ts
      # rewrite). Per file: fetch the origin/main blob into a temp path with
      # `git show` (never touches the working tree — no stash/checkout) and
      # --check it.
      #   - base --check passes, PR version fails -> NEW drift -> fail.
      #   - base --check fails -> pre-existing debt -> skip regardless of PR
      #     version.
      #   - status == added (no baseline can exist) -> checked like today,
      #     never treated as debt.
      # --check exits 1 on the first bad file in a batch, so baseline and PR
      # versions are always checked one file at a time — batching would
      # collapse which file was already broken. That costs up to two
      # `prettier` invocations per changed file instead of one; elapsed time
      # is logged below so that cost stays visible.
      - name: Format check (Prettier, new drift only)
        if: steps.scope.outputs.format == 'true'
        working-directory: v3
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -uo pipefail
          start=$(date +%s%N)
          fail=0
          new_count=0
          debt_count=0
          drift_count=0
          tmpdir="$RUNNER_TEMP/prettier-baseline"
          mkdir -p "$tmpdir"

          while IFS=$'\t' read -r status path prevpath; do
            [ -z "$path" ] && continue

            if [ "$status" = "added" ]; then
              if ! ./node_modules/.bin/prettier --check "$path"; then
                echo "::error file=v3/${path}::New file not formatted (not pre-existing debt, must be formatted)."
                fail=1
              fi
              new_count=$((new_count + 1))
              continue
            fi

            base_path="${prevpath:-$path}"
            base_tmp="$tmpdir/$(printf '%s' "$base_path" | tr '/' '_').${path##*.}"

            if ! git show "${BASE_REF}:v3/${base_path}" > "$base_tmp" 2>/dev/null; then
              # No baseline on origin/main (e.g. moved into v3/ from
              # elsewhere) -> nothing to be debt against, check like new.
              if ! ./node_modules/.bin/prettier --check "$path"; then
                echo "::error file=v3/${path}::Not formatted, and no origin/main baseline found for it."
                fail=1
              fi
              new_count=$((new_count + 1))
              continue
            fi

            if ./node_modules/.bin/prettier --check "$base_tmp" >/dev/null 2>&1; then
              if ! ./node_modules/.bin/prettier --check "$path"; then
                echo "::error file=v3/${path}::New formatting drift (origin/main version was already formatted)."
                fail=1
                drift_count=$((drift_count + 1))
              fi
            else
              echo "Pre-existing debt, skipping: $path"
              debt_count=$((debt_count + 1))
            fi
            rm -f "$base_tmp"
          done < "$RUNNER_TEMP/prettier-files.tsv"

          end=$(date +%s%N)
          echo "Prettier baseline check took $(( (end - start) / 1000000 ))ms (new=$new_count, pre-existing debt skipped=$debt_count, new drift=$drift_count)"
          exit $fail

      - name: Wiki convention lint
        run: python3 docs/wiki/_meta/lint_wiki.py docs/wiki

      - name: Wiki freshness tests
        run: python3 -m unittest docs/wiki/_meta/test_check_wiki_freshness.py

      - name: Wiki freshness check
        if: github.event_name == 'pull_request'
        run: python3 docs/wiki/_meta/check_wiki_freshness.py origin/${{ github.base_ref }}...HEAD

      - name: Wiki freshness check
        if: github.event_name == 'push'
        run: python3 docs/wiki/_meta/check_wiki_freshness.py ${{ github.event.before }} ${{ github.sha }}
