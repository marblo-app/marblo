name: Build & Release

# WHO RUNS WHAT (this split exists for billing reasons — read before widening it):
#   pull_request       → `verify` only. One ubuntu-latest runner (1x minute
#                        multiplier). typecheck + unit tests. NO installers.
#                        Always runs (required check); on a docs-only diff it
#                        skips its own heavy steps instead of skipping the job.
#   push: main         → `build` matrix, LINUX LEG ONLY (~6 min, 1x). Real
#                        electron-builder packaging, so main keeps a daily
#                        "did packaging break" signal at a price it can pay.
#   tag v*             → `build` matrix, ALL platforms, then `release`.
#   workflow_dispatch  → `build` matrix, filtered by the `platform` input.
#
# Private-repo minute multipliers are macOS 10x, Windows 2x, Linux 1x, and the
# two mac legs sign + notarize (~25 min each), so one full matrix pass costs
# ~518 Linux-equivalent minutes — of which ~500 (96%) is the two mac legs.
# This workflow triggers on BOTH pull_request and push:main, so a single PR
# used to pay for that twice (~1,036 min): a third of the 3,000 min/month
# GitHub Pro private-repo allowance for ONE pull request, and ~15,540 min/day at
# the observed ~30 merges/day. mac and win installers are therefore produced only
# where an installer is actually consumed — a v* tag — or on demand via
# workflow_dispatch. Per PR that is 1,036 → 11 minutes.
#
# That split is LIVE and verified: across 147 pull_request runs in the week to
# 2026-09-03, every `build` matrix job was skipped — 0 billable minutes. The
# remaining spend is `verify` (the gate), not packaging.
#
# DOC-ONLY PRs still run `verify`, but `verify` does no work on them: the job
# starts, sees a docs-only diff, and skips install/typecheck/test at STEP level
# (see the "Detect docs-only PR" step). It MUST still run — `verify` is a
# required status check, and a check that never reports blocks the merge
# forever rather than passing it. Measured 2026-09-03 over 2026-08-27..09-03:
# `verify` on pull_request is 341 of the 753 billable minutes this repo spends
# in a week (45%) — the single largest line — and ~30% of recent PRs (12 of the
# last 40) touch nothing but markdown/docs. Typecheck and vitest cannot fail on
# a markdown-only diff, so those runs bought nothing. Verified before adding
# this: no test or source file reads a real .md from disk (every `.md` in
# v3/tests is a string literal in a pure unit test), so skipping the work on
# these paths cannot mask a real failure. A docs-only pass now costs the one
# billable minute of an almost-empty job instead of ~3-5.
on:
  push:
    # NO `paths-ignore` HERE, DELIBERATELY. This `push` block also matches the
    # `v*` release tags, and GitHub applies path filters to tag pushes too — a
    # release tag whose diff happened to be docs-only would silently produce NO
    # installers and NO release. The main-push linux smoke is ~1 billable minute
    # a run and ran 3 times in the measured week; filtering it saves nothing and
    # risks the release path. Cost control belongs on the PR side only.
    branches: [main]
    tags: ["v*"]
  pull_request:
    # NO `paths-ignore` HERE, AND IT MUST STAY THAT WAY — this is a required
    # status check. `verify` is listed in the "main rules" repository ruleset
    # (id 22175572) alongside `lint`. A required check is satisfied only by a
    # check RUN that reports a conclusion. If a path filter stops the workflow
    # from triggering — or a job-level `if:` makes the job end as SKIPPED —
    # GitHub never creates that run, so the required check sits in "expected"
    # forever: mergeStateStatus=BLOCKED, and even `gh pr merge --admin` refuses
    # with `Required status check "verify" is expected`. That is exactly what
    # a `paths-ignore` here did to PRs #1375 #1378 #1395 #1396 (task
    # LnO08ibtLGTIVgGgWQGo): four docs-only PRs, permanently unmergeable.
    #
    # The docs-only saving that motivated the filter is preserved — it just
    # moved DOWN a level, into step-level `if:`s inside `verify` (see the
    # "Detect docs-only PR" step). The job always runs and always reports;
    # on a docs-only diff it installs nothing and runs no tests, so it costs
    # one billable Linux minute instead of ~3-5 and still reports SUCCESS.
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - mac
          - win
          - linux
      dogfood:
        # Internal/dogfood build: injects VITE_FIRST_PARTY_TELEMETRY=1 so the
        # first-party analytics gate (lib/telemetry/firstPartyGate.ts) initializes
        # ON. Leave FALSE for anything an external/beta user could receive.
        # PIPA (제15조): external builds must transmit no analytics without opt-in,
        # so this is opt-in-only, gated to workflow_dispatch, and can never fire on
        # a tag/release build (see the "Enable first-party telemetry" step guard).
        description: "Internal dogfood build (enables first-party telemetry). Leave false for external release."
        required: false
        default: false
        type: boolean

# Superseded PR runs are pure waste: pushing three times to a PR used to leave
# two doomed runs burning runners. Cancel only on pull_request — a main or tag
# run must never be cancelled by the next push, so those queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR gate. Everything a PR can be told about the code WITHOUT packaging an
  # installer: both TypeScript projects typecheck, and the vitest suite runs.
  # ESLint is not duplicated here — lint.yml already gates PRs on it.
  # One ubuntu-latest runner, 1x multiplier. If this ever needs to grow, grow it
  # on ubuntu; adding a mac or win leg here re-creates the bill this replaced.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Read-only. The docs-only probe below asks the API which files the PR
    # touches; nothing in this job writes anything.
    permissions:
      contents: read
      pull-requests: read
    # Typecheck + unit tests are a few minutes. Cap well under the 360-min
    # default so a hung vitest cannot pin a runner.
    timeout-minutes: 20

    steps:
      # ── DOCS-ONLY SHORT-CIRCUIT (STEP level, never job level) ─────────────
      # This replaces the `paths-ignore` that used to sit on the `pull_request`
      # trigger. Same saving, but the job still runs and still reports `verify`
      # — see the long note on the trigger for why a skipped required check is
      # unmergeable rather than green.
      #
      # The three patterns below are the old globs, one for one:
      #   `**.md`      → `\.md$`   (matches at any depth, root CHANGELOG.md too)
      #   `docs/**`    → `^docs/`
      #   `**/docs/**` → `/docs/`   (v3/docs, marblo-web/docs, v3/functions/docs)
      # A PR is docs-only only when EVERY changed file matches one of them; a
      # PR touching both docs and code still pays for the full gate.
      #
      # Every failure path here falls back to docs_only=false — an unreadable
      # file list must cost a few minutes, never skip the gate silently.
      - name: Detect docs-only PR
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if ! files=$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                -q '.[].filename'); then
            echo "::warning::Could not list PR files; running the full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(printf '%s\n' "$files" | grep -v '^[[:space:]]*$' || true)
          if [ -z "$files" ]; then
            echo "::warning::Empty changed-file list; running the full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'
          non_docs=$(printf '%s\n' "$files" | grep -Ev '(\.md$|^docs/|/docs/)' || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only diff: install, typecheck and tests are skipped."
            echo "This job still runs to completion, so \`verify\` reports SUCCESS."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-docs files changed; running the full gate:"
            printf '%s\n' "$non_docs" | sed 's/^/  /'
          fi

      - name: Checkout
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v3/package-lock.json

      # `npm install`, not `npm ci`: the committed lock is generated on macOS and
      # omits electron-builder's optional win32 subtree, so `npm ci` fails on
      # Linux with "Missing … from lock file" (same reason lint.yml uses install).
      #
      # `--ignore-scripts` skips the postinstall electron-rebuild, which builds
      # the node-pty native module and is the step that needs a working
      # node-gyp/Python toolchain. Nothing here needs node-pty: vitest runs with
      # environment "node" and no test imports it.
      #
      # NOT `--omit=optional` (lint.yml can afford that, this job cannot):
      # rollup ships its platform binary as an OPTIONAL dependency, so omitting
      # optionals makes vite/vitest die at startup with
      # "Cannot find module @rollup/rollup-linux-x64-gnu". Verified locally.
      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: v3
        run: npm install --no-audit --no-fund --ignore-scripts

      # --ignore-scripts also skips electron's own postinstall, which downloads
      # the Electron binary and writes node_modules/electron/path.txt.
      # tests/unit/bundleInstaller.test.ts requires("electron"), which throws
      # ("Electron failed to install correctly") without it. Run just that one
      # download script — it is a plain fetch+unzip with no native compile, so it
      # brings back the binary without dragging in the electron-rebuild toolchain.
      - name: Fetch Electron binary (for tests that require("electron"))
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: v3
        run: node node_modules/electron/install.js

      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: v3
        run: npm run typecheck

      # Blocking gate (promoted 2026-09-03, task XsHBHYHkigIePC4UAzIr). This step
      # used to carry `continue-on-error: true` while 4 pre-existing failures on
      # main were being fixed (task OfbgCyJSp2g8k3E4uYzB, since landed) — but it
      # stayed on past that point, so `main` quietly regressed 3 *more* failures
      # (tests/unit/rootPathScope.test.ts, projectPaths.test.ts: relied on the
      # ambient `navigator` global Node only provides from v21+, which this
      # job's node20 doesn't have) without anyone noticing, because Test always
      # showed green regardless. Fixed by pinning `@vitest-environment jsdom` on
      # those two files. Do not re-add `continue-on-error` here as a quick fix
      # for a new failure — fix the failure, or take it to the team first.
      - name: Test
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: v3
        run: npm test

  build:
    # ── COST GATE ──────────────────────────────────────────────────────────
    # Installers are never built for a pull_request. This is a JOB-level `if:`
    # on purpose and it is legal here because it touches only the `github`
    # context — see the matrix-context trap documented on the guard step below.
    # A PR gets the `verify` job above instead.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-13
            platform: mac
            arch: x64
          # Pinned to windows-2022 (not windows-latest). The latest image now ships
          # Visual Studio 18 (VS 2026), whose major version has no entry in node-gyp's
          # VS-version table (15→2017, 16→2019, 17→2022), so node-gyp reports
          # "unknown version undefined" and the node-pty native rebuild fails. VS 2026
          # is too new for any released node-gyp. windows-2022 carries VS 2022
          # (major 17), which node-gyp fully supports. Revisit once node-gyp ships
          # VS 2026 support.
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    # Fail fast instead of hanging for the 360-minute default. A native rebuild or
    # electron-builder download that stalls would otherwise pin a runner for hours
    # and (with the concurrency limit) keep the other matrix legs queued.
    # mac gets a longer cap: code signing + Apple notarization (notarytool upload +
    # server-side wait) routinely exceeds 22 min and is NOT a hang. win/linux finish
    # in ~6 min, so they keep the tight 30 guard.
    timeout-minutes: ${{ matrix.platform == 'mac' && 70 || 30 }}

    steps:
      # NOTE: the platform filter for workflow_dispatch must live at STEP level.
      # A job-level `if:` cannot reference the `matrix` context (it is evaluated
      # before matrix expansion → "Unrecognized named-value: 'matrix'" → the whole
      # workflow fails validation and spawns 0 jobs). This guard step is the only
      # place that decides whether the rest of the matrix leg should run.
      # (The job-level `if:` above is fine because it reads only `github`.)
      - name: Determine whether to build this platform
        id: guard
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              # Belt and braces. The job-level `if:` already keeps this job off
              # PRs; this makes the matrix inert even if someone deletes it.
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Skipping ${{ matrix.platform }}: installers are not built on pull_request (see the header comment)."
              ;;
            workflow_dispatch)
              # Manual builds keep their platform picker — this is the path used
              # to cut a Windows build by hand. Do not narrow it.
              if [[ "${{ github.event.inputs.platform }}" == "all" \
                    || "${{ github.event.inputs.platform }}" == "${{ matrix.platform }}" ]]; then
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "Building ${{ matrix.platform }}-${{ matrix.arch }}"
              else
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "Skipping ${{ matrix.platform }} (workflow_dispatch selected '${{ github.event.inputs.platform }}')"
              fi
              ;;
            push)
              if [[ "${{ github.ref }}" == refs/tags/* ]]; then
                # v* tag → every platform. A release needs all of them.
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "Building ${{ matrix.platform }}-${{ matrix.arch }} (tag build — full matrix)"
              elif [[ "${{ matrix.platform }}" == "linux" ]]; then
                # push to main → linux ONLY (1x). This leg is not a formality:
                # it runs the real `electron-builder --linux`, which rebuilds
                # node-pty natively (no npmRebuild override outside windows) and
                # packages .AppImage/.deb through fpm. That is where the
                # packaging breakages this file has actually hit live —
                # the fpm author field, electron-builder config overrides — so
                # main keeps a daily packaging signal for ~6 Linux-minutes.
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "Building ${{ matrix.platform }}-${{ matrix.arch }} (main push — linux-only smoke)"
              else
                # mac (10x) and win (2x) on every merge to main is what made the
                # bill. Installers for those come from a v* tag, or on demand via
                # workflow_dispatch.
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "Skipping ${{ matrix.platform }}: main pushes build linux only. Cut a v* tag or use workflow_dispatch for mac/win."
              fi
              ;;
            *)
              # Unlisted event. Default to NOT spending money: whoever adds a
              # trigger to `on:` must come here and say what it should build.
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Skipping ${{ matrix.platform }}: event '${{ github.event_name }}' has no rule in this guard."
              ;;
          esac

      - name: Checkout
        if: steps.guard.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.guard.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v3/package-lock.json

      # node-gyp (pulled in transitively for the node-pty native module) ships a
      # bundled gyp that cannot run under Python 3.12 (distutils was removed).
      # GitHub runners default to 3.12, which makes any native rebuild fail with
      # a gyp import error. Pin 3.11 so node-gyp works on every OS.
      - name: Setup Python (for node-gyp)
        if: steps.guard.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.build == 'true'
        working-directory: v3
        # Two known hazards, both handled here without touching the committed lockfile:
        #  1. The committed package-lock.json drifts out of sync with package.json
        #     (npm ci → EUSAGE). Fall back to `npm install` to reconcile per-runner.
        #  2. The `postinstall: electron-rebuild` hook rebuilds the node-pty native
        #     module at install time and fails on CI toolchains. `--ignore-scripts`
        #     skips it; electron-builder rebuilds native modules itself during
        #     packaging (npmRebuild defaults to true), which is the correct place.
        run: npm ci --ignore-scripts || npm install --ignore-scripts --no-audit --no-fund

      # Replace the transitively-pinned node-gyp 9.4.1 with node-gyp 10 across the
      # tree (the hoisted copy and the one @electron/rebuild resolves). 9.4.1 is old
      # enough to mis-handle the current windows toolchain; 10 generates a modern
      # vcxproj. No lockfile/package.json change. (VS *detection* itself is handled
      # by the MSVC dev-environment step below, not by this node-gyp swap.)
      - name: Upgrade node-gyp (win)
        if: steps.guard.outputs.build == 'true' && matrix.platform == 'win'
        working-directory: v3
        shell: bash
        run: |
          npm install -g --no-audit --no-fund node-gyp@10
          NG_SRC="$(npm root -g)/node-gyp"
          echo "Global node-gyp@10 at: $NG_SRC"
          for dest in node_modules/node-gyp node_modules/@electron/rebuild/node_modules/node-gyp; do
            if [ -d "$(dirname "$dest")" ]; then
              rm -rf "$dest"
              cp -r "$NG_SRC" "$dest"
              echo "Replaced $dest with node-gyp@10"
            fi
          done

      # node-gyp finds Visual Studio by running a PowerShell script that enumerates
      # every VS install as JSON, captured through execFile's maxBuffer. The runner
      # now ships Visual Studio 18 (VS 2026) alongside 2022, and the combined
      # enumeration overflows that buffer (RangeError ERR_CHILD_PROCESS_STDIO_MAXBUFFER):
      # the JSON is truncated, node-gyp parses the version as "undefined", and the
      # node-pty rebuild fails — or HANGS for the full timeout when the caller
      # (electron-builder / electron-rebuild) captures the child's stdout, because the
      # oversized output fills the unread pipe and the child blocks on write. node-gyp
      # checks VCINSTALLDIR *before* that PowerShell probe, so importing the VS
      # developer environment here (vswhere -> vcvars64) makes node-gyp use this path
      # and skip the probe entirely. Persisted via GITHUB_ENV/GITHUB_PATH so the
      # rebuild and packaging steps inherit it. Self-contained (no third-party action).
      - name: Set up MSVC build environment (win)
        if: steps.guard.outputs.build == 'true' && matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the C++ toolset found on the runner" }
          Write-Host "Using Visual Studio at: $vs"
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]; $value = $matches[2]
              if ($name -ieq 'Path') {
                ($value -split ';') | Where-Object { $_ -and ($before['Path'] -notlike "*$_*") } | ForEach-Object {
                  $_ | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
                }
              } elseif (($before[$name] -ne $value) -and ($name -notmatch '^(GITHUB_|RUNNER_|PROMPT$)')) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }
          Write-Host "VCINSTALLDIR will be exported for node-gyp:"
          (cmd /c "`"$vcvars`" >nul 2>&1 && echo %VCINSTALLDIR%")

      # node-pty is the only native module. With the MSVC environment imported above,
      # node-gyp uses VCINSTALLDIR and skips the buffer-overflowing PowerShell probe,
      # so build node-pty against the Electron ABI by calling node-gyp DIRECTLY here.
      # Direct invocation streams node-gyp/MSBuild output straight to the step console
      # (no captured pipe → no buffer-fill deadlock) and --verbose surfaces any stall.
      # The packaging step then runs with -c.npmRebuild=false on windows so
      # electron-builder ships this binary instead of rebuilding it. Windows-only;
      # mac/linux keep npmRebuild's default (true) → no regression.
      - name: Pre-rebuild node-pty for Electron (win)
        if: steps.guard.outputs.build == 'true' && matrix.platform == 'win'
        working-directory: v3
        shell: bash
        timeout-minutes: 10
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          NG="$PWD/node_modules/node-gyp/bin/node-gyp.js"
          echo "node-gyp: $(node "$NG" --version)"
          cd node_modules/node-pty
          node "$NG" rebuild --verbose --arch=x64 \
            --target=33.4.11 --dist-url=https://electronjs.org/headers

      - name: Create .env
        if: steps.guard.outputs.build == 'true'
        working-directory: v3
        # Force bash: the default shell on windows runners is PowerShell, which
        # cannot run this heredoc.
        shell: bash
        run: |
          cat > .env << 'EOF'
          VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          EOF

      # LEGACY NO-OP (kept for build-profile parity). First-party telemetry is now
      # ON by default for ALL builds (production real-users included) — CEO-approved
      # 2026-07-17, gate flipped in PR#397. firstPartyGate.ts no longer reads
      # VITE_FIRST_PARTY_TELEMETRY, so appending it here changes nothing; dogfood and
      # release builds behave identically. De-identified 1st-party aggregate only;
      # the hard opt-out is VITE_DISABLE_TELEMETRY=1. Retained to avoid churning the
      # workflow_dispatch input; safe to delete in a later cleanup.
      - name: Enable first-party telemetry (legacy no-op — default is ON)
        if: >-
          steps.guard.outputs.build == 'true'
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.dogfood == 'true'
          && !startsWith(github.ref, 'refs/tags/')
        working-directory: v3
        shell: bash
        run: |
          echo "VITE_FIRST_PARTY_TELEMETRY=1" >> .env
          echo "::notice::Internal dogfood build — first-party telemetry ENABLED (VITE_FIRST_PARTY_TELEMETRY=1)."

      - name: Build app
        if: steps.guard.outputs.build == 'true'
        working-directory: v3
        run: npm run build:electron

      - name: Verify macOS signing inputs
        if: steps.guard.outputs.build == 'true' && matrix.platform == 'mac' && github.event_name != 'pull_request'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is required for signed and notarized macOS release builds"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          echo "macOS signing and notarization inputs are present."

      - name: Build Electron (${{ matrix.platform }}-${{ matrix.arch }})
        if: steps.guard.outputs.build == 'true'
        working-directory: v3
        # mac: sign + notarize can run well past 22 min (notarytool waits on Apple's
        # notarization service). Give mac 55 min; keep win/linux at 22 as a hang guard
        # (their build is ~6 min, so a 22-min cap still catches a genuine stall).
        timeout-minutes: ${{ matrix.platform == 'mac' && 55 || 22 }}
        # Force bash on every OS. Under the windows default shell (PowerShell) the
        # `-c.extraMetadata.*=...` overrides get mangled into a bogus config-file
        # path (ENOENT). Git Bash is present on windows runners and tokenizes the
        # args identically to the mac/linux legs, which build cleanly.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable MSBuild node reuse. Persisted MSBuild build nodes are a known
          # cause of native-rebuild hangs on windows CI runners — the node-pty
          # rebuild stalled indefinitely at "preparing moduleName=node-pty".
          # Harmless on mac/linux (no MSBuild).
          MSBUILDDISABLENODEREUSE: "1"
          # Verbose electron-builder logging on windows only, to surface where a
          # stall happens if one recurs. Empty (no-op) on mac/linux.
          DEBUG: ${{ matrix.platform == 'win' && 'electron-builder' || '' }}
          # macOS code signing + notarization — gated to the mac legs ONLY. These
          # were previously set for every platform, which leaked the Apple
          # "Developer ID" cert (CSC_LINK) into the windows leg; electron-builder
          # picked it up and would try to Authenticode-sign the nsis installer with
          # a cert that isn't valid for windows. Windows must ship UNSIGNED from CI
          # (see below), so emit empty values there (and on linux).
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          # Make the notarize afterSign hook FAIL (not silently skip) when Apple
          # credentials are missing on a real (non-PR) mac release build. Mac legs
          # only; empty elsewhere so the hook keeps its skip-on-missing behavior.
          MARBLO_REQUIRE_MAC_NOTARIZATION: ${{ matrix.platform == 'mac' && github.event_name != 'pull_request' }}
          # Windows is shipped UNSIGNED from CI. Code signing is done manually
          # with the KoreaSSL USB token (see v3/docs/code_signing_setup.md Part B),
          # so no WIN_CSC_* secrets are wired here. electron-builder produces an
          # unsigned nsis installer when no certificate is present.
        # package.json has no `author` field; the linux fpm target (.deb) requires
        # an author email. Inject it via electron-builder config override instead
        # of editing package.json. Object form (.name/.email) avoids angle-bracket
        # quoting issues across bash/pwsh. Harmless on mac/win.
        #
        # On windows only, -c.npmRebuild=false: node-pty was already rebuilt against
        # Electron by the pre-rebuild step above, so skip electron-builder's
        # in-process rebuild (the one that deadlocked on the MSBuild output pipe).
        # mac/linux pass no override → npmRebuild stays true and they rebuild
        # node-pty during packaging exactly as before (no regression).
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never -c.extraMetadata.author.name=Marblo -c.extraMetadata.author.email=support@marblo.app ${{ matrix.platform == 'win' && '-c.npmRebuild=false' || '' }}

      - name: Verify macOS notarization smoke
        if: steps.guard.outputs.build == 'true' && matrix.platform == 'mac' && github.event_name != 'pull_request'
        working-directory: v3
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "::error::No macOS .app bundle found in v3/dist"
            exit 1
          fi
          dmg_path="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "${dmg_path}" ]]; then
            echo "::error::No macOS .dmg artifact found in v3/dist"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"
          xcrun stapler validate "${app_path}"
          hdiutil verify "${dmg_path}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg_path}"

      - name: Smoke packaged macOS app boot
        if: steps.guard.outputs.build == 'true' && matrix.platform == 'mac'
        working-directory: v3
        shell: bash
        run: npm run smoke:packaged:mac

      - name: Upload artifacts
        if: steps.guard.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marblo-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            v3/dist/*.dmg
            v3/dist/*.zip
            v3/dist/*.exe
            v3/dist/*.AppImage
            v3/dist/*.deb
          if-no-files-found: ignore
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
