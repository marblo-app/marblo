name: Merge History Capture

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  record:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Collect merged PR stats
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const match = branch.match(/^marblo\/[^/\s]+-([A-Za-z0-9]{8})$/);

            if (!match) {
              core.notice(`Skipping merge history capture: branch '${branch}' does not include a Marblo task prefix.`);
              core.setOutput('skip', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const payload = {
              prNumber: pr.number,
              taskId: match[1],
              taskId8: match[1],
              mergedAt: pr.merged_at,
              branch,
              baseRef: pr.base.ref,
              headSha: pr.merge_commit_sha || pr.head.sha,
              owner: context.repo.owner,
              repository: context.repo.repo,
              filesChanged: files.length,
              linesAdded: files.reduce((sum, file) => sum + (file.additions || 0), 0),
              linesDeleted: files.reduce((sum, file) => sum + (file.deletions || 0), 0),
              paths: files.map((file) => file.filename),
            };

            core.setOutput('skip', 'false');
            core.setOutput('payload', JSON.stringify(payload));

      - name: Send merge history
        if: steps.collect.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          WEBHOOK_URL: ${{ secrets.MERGE_HISTORY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.MERGE_HISTORY_WEBHOOK_TOKEN }}
          PAYLOAD: ${{ steps.collect.outputs.payload }}
        with:
          script: |
            const webhookUrl = process.env.WEBHOOK_URL;
            const webhookToken = process.env.WEBHOOK_TOKEN;

            if (!webhookUrl || !webhookToken) {
              core.notice('Skipping merge history capture: webhook URL/token secrets are not configured.');
              return;
            }

            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${webhookToken}`,
                'Content-Type': 'application/json',
              },
              body: process.env.PAYLOAD,
            });

            if (!response.ok) {
              const body = await response.text().catch(() => '<unreadable body>');
              core.setFailed(`Merge history webhook failed: HTTP ${response.status} ${response.statusText} - ${body.slice(0, 500)}`);
              return;
            }

            core.info(`Merge history recorded (HTTP ${response.status}).`);
