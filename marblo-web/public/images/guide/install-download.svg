<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="dl-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="dl-glow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- window frame -->
  <rect x="8" y="8" width="1184" height="744" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
  <!-- browser chrome -->
  <path d="M8 24 a16 16 0 0 1 16 -16 h1152 a16 16 0 0 1 16 16 v40 h-1184 z" fill="#111113"/>
  <line x1="8" y1="64" x2="1192" y2="64" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="36" cy="36" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="36" r="6" fill="#febc2e"/>
  <circle cx="80" cy="36" r="6" fill="#28c840"/>
  <!-- url bar -->
  <rect x="120" y="22" width="720" height="28" rx="8" fill="#09090b" stroke="#27272a"/>
  <path d="M138 33 a5 5 0 0 1 10 0 v3 h-10 z M140 33 v-1 a3 3 0 0 1 6 0 v1" fill="none" stroke="#71717a" stroke-width="1.4"/>
  <text x="160" y="41" fill="#a1a1aa" font-size="13">marblo.app/download</text>

  <!-- page canvas -->
  <rect x="8" y="64" width="1184" height="688" fill="url(#dl-bg)"/>
  <rect x="8" y="64" width="1184" height="360" fill="url(#dl-glow)"/>

  <!-- brand mark + heading -->
  <rect x="524" y="112" width="44" height="44" rx="12" fill="url(#dl-brand)"/>
  <circle cx="546" cy="134" r="9" fill="#0a0a0b"/>
  <circle cx="546" cy="134" r="4" fill="#c7d2fe"/>
  <text x="580" y="143" fill="#fafafa" font-size="26" font-weight="700">Marblo</text>
  <text x="600" y="200" fill="#fafafa" font-size="34" font-weight="800" text-anchor="middle">데스크톱 앱 다운로드</text>
  <text x="600" y="234" fill="#a1a1aa" font-size="16" text-anchor="middle">운영체제에 맞는 최신 빌드를 받으세요 · v3.0.13</text>

  <!-- macOS card -->
  <rect x="196" y="292" width="384" height="300" rx="14" fill="#141416" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="196" y="292" width="384" height="300" rx="14" fill="#6366f1" fill-opacity="0.05"/>
  <!-- apple glyph -->
  <g transform="translate(366,332)" fill="#e4e4e7">
    <path d="M33 30 c-1 3 -2 6 -4 9 c-2 3 -4 6 -7 6 c-2 0 -3 -1 -6 -1 c-3 0 -4 1 -6 1 c-3 0 -5 -3 -8 -7 c-4 -6 -6 -14 -3 -20 c2 -3 5 -5 8 -5 c3 0 4 1 6 1 c2 0 4 -1 7 -1 c2 0 5 1 7 3 c-5 3 -5 11 3 14 z"/>
    <path d="M25 8 c1 -3 4 -5 7 -5 c0 3 -1 6 -3 8 c-2 2 -4 4 -7 4 c0 -3 1 -5 3 -7 z"/>
  </g>
  <text x="388" y="440" fill="#fafafa" font-size="22" font-weight="700" text-anchor="middle">macOS</text>
  <text x="388" y="466" fill="#a1a1aa" font-size="13" text-anchor="middle">Apple Silicon · Intel</text>
  <rect x="236" y="496" width="304" height="46" rx="10" fill="url(#dl-brand)"/>
  <path d="M388 510 v14 m0 0 l-6 -6 m6 6 l6 -6 M378 528 h20" stroke="#0a0a0b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="416" y="524" fill="#0a0a0b" font-size="15" font-weight="700">.dmg 다운로드</text>

  <!-- Windows card -->
  <rect x="620" y="292" width="384" height="300" rx="14" fill="#141416" stroke="#27272a" stroke-width="1.5"/>
  <!-- windows glyph -->
  <g transform="translate(790,352)">
    <rect x="0" y="0" width="16" height="16" fill="#818cf8"/>
    <rect x="20" y="0" width="16" height="16" fill="#a5b4fc"/>
    <rect x="0" y="20" width="16" height="16" fill="#a5b4fc"/>
    <rect x="20" y="20" width="16" height="16" fill="#818cf8"/>
  </g>
  <text x="812" y="440" fill="#fafafa" font-size="22" font-weight="700" text-anchor="middle">Windows</text>
  <text x="812" y="466" fill="#a1a1aa" font-size="13" text-anchor="middle">Windows 10 · 11 (x64)</text>
  <rect x="660" y="496" width="304" height="46" rx="10" fill="#27272a" stroke="#3f3f46"/>
  <path d="M812 510 v14 m0 0 l-6 -6 m6 6 l6 -6 M802 528 h20" stroke="#e4e4e7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="840" y="524" fill="#e4e4e7" font-size="15" font-weight="700">.exe 다운로드</text>

  <text x="600" y="636" fill="#71717a" font-size="13" text-anchor="middle">첫 실행 시 필요한 에이전트 CLI가 자동으로 설치됩니다</text>
</svg>
