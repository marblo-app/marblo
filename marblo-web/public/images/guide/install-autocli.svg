<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="ac-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="ac-glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- window frame -->
  <rect x="8" y="8" width="1184" height="744" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <path d="M8 24 a16 16 0 0 1 16 -16 h1152 a16 16 0 0 1 16 16 v24 h-1184 z" fill="#111113"/>
  <line x1="8" y1="48" x2="1192" y2="48" stroke="#1c1c1f" stroke-width="1.5"/>
  <circle cx="36" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="28" r="6" fill="#febc2e"/>
  <circle cx="80" cy="28" r="6" fill="#28c840"/>
  <text x="600" y="33" fill="#71717a" font-size="12.5" text-anchor="middle" font-weight="600">Marblo — 초기 설정</text>

  <rect x="8" y="48" width="1184" height="704" fill="#09090b"/>
  <rect x="8" y="48" width="1184" height="500" fill="url(#ac-glow)"/>

  <!-- setup panel -->
  <rect x="300" y="150" width="600" height="470" rx="18" fill="#141416" stroke="#27272a" stroke-width="1.5"/>

  <!-- header -->
  <rect x="336" y="188" width="34" height="34" rx="9" fill="url(#ac-brand)"/>
  <path d="M346 205 l5 5 l9 -10" stroke="#0a0a0b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="386" y="204" fill="#fafafa" font-size="19" font-weight="700">필수 도구 자동 설치</text>
  <text x="386" y="224" fill="#71717a" font-size="13">에이전트 CLI와 Marblo MCP를 준비하고 있어요</text>

  <line x1="336" y1="248" x2="864" y2="248" stroke="#27272a"/>

  <!-- item: Claude Code (done) -->
  <circle cx="357" cy="292" r="13" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5"/>
  <path d="M351 292 l4 4 l8 -8" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="384" y="290" fill="#e4e4e7" font-size="15" font-weight="600">Claude Code CLI</text>
  <text x="384" y="308" fill="#71717a" font-size="12">claude · 설치 완료</text>
  <text x="842" y="297" fill="#34d399" font-size="12.5" font-weight="600" text-anchor="end">완료</text>

  <!-- item: Codex (done) -->
  <circle cx="357" cy="348" r="13" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5"/>
  <path d="M351 348 l4 4 l8 -8" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="384" y="346" fill="#e4e4e7" font-size="15" font-weight="600">Codex CLI</text>
  <text x="384" y="364" fill="#71717a" font-size="12">codex · 설치 완료</text>
  <text x="842" y="353" fill="#34d399" font-size="12.5" font-weight="600" text-anchor="end">완료</text>

  <!-- item: Antigravity (in progress) -->
  <circle cx="357" cy="404" r="13" fill="#6366f1" fill-opacity="0.12" stroke="#3f3f46" stroke-width="1.5"/>
  <path d="M357 393 a11 11 0 0 1 11 11" fill="none" stroke="#818cf8" stroke-width="2.4" stroke-linecap="round"/>
  <text x="384" y="402" fill="#e4e4e7" font-size="15" font-weight="600">Antigravity CLI</text>
  <text x="384" y="420" fill="#818cf8" font-size="12">antigravity · 다운로드 중…</text>
  <text x="842" y="409" fill="#818cf8" font-size="12.5" font-weight="600" text-anchor="end">설치 중</text>

  <!-- item: Marblo MCP (pending) -->
  <circle cx="357" cy="460" r="13" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <circle cx="357" cy="460" r="3" fill="#52525b"/>
  <text x="384" y="458" fill="#a1a1aa" font-size="15" font-weight="600">Marblo MCP</text>
  <text x="384" y="476" fill="#71717a" font-size="12">칸반·오케스트레이션 브리지 · 대기 중</text>
  <text x="842" y="465" fill="#71717a" font-size="12.5" font-weight="600" text-anchor="end">대기</text>

  <!-- overall progress bar -->
  <rect x="336" y="520" width="528" height="10" rx="5" fill="#1c1c1f"/>
  <rect x="336" y="520" width="330" height="10" rx="5" fill="url(#ac-brand)"/>
  <text x="336" y="558" fill="#71717a" font-size="12.5">4개 중 2개 완료</text>
  <text x="864" y="558" fill="#a1a1aa" font-size="12.5" font-weight="600" text-anchor="end">62%</text>

  <text x="600" y="672" fill="#71717a" font-size="13" text-anchor="middle">설치가 끝나면 다음 단계에서 각 CLI에 로그인만 하면 됩니다</text>
</svg>
