<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="run-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="run-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- window frame -->
  <rect x="8" y="8" width="1184" height="744" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <!-- title bar -->
  <path d="M8 24 a16 16 0 0 1 16 -16 h1152 a16 16 0 0 1 16 16 v24 h-1184 z" fill="#111113"/>
  <line x1="8" y1="48" x2="1192" y2="48" stroke="#1c1c1f" stroke-width="1.5"/>
  <circle cx="36" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="28" r="6" fill="#febc2e"/>
  <circle cx="80" cy="28" r="6" fill="#28c840"/>
  <text x="600" y="33" fill="#71717a" font-size="12.5" text-anchor="middle" font-weight="600">Marblo</text>

  <!-- canvas glow -->
  <rect x="8" y="48" width="1184" height="704" fill="#09090b"/>
  <rect x="8" y="48" width="1184" height="704" fill="url(#run-glow)"/>

  <!-- brand mark -->
  <rect x="536" y="214" width="128" height="128" rx="34" fill="url(#run-brand)"/>
  <rect x="536" y="214" width="128" height="128" rx="34" fill="none" stroke="#c7d2fe" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="600" cy="278" r="26" fill="#0a0a0b"/>
  <circle cx="600" cy="278" r="11" fill="#c7d2fe"/>
  <circle cx="636" cy="248" r="6" fill="#0a0a0b" fill-opacity="0.55"/>
  <circle cx="566" cy="308" r="5" fill="#0a0a0b" fill-opacity="0.55"/>

  <!-- welcome copy -->
  <text x="600" y="410" fill="#fafafa" font-size="40" font-weight="800" text-anchor="middle">Marblo에 오신 것을 환영합니다</text>
  <text x="600" y="450" fill="#a1a1aa" font-size="17" text-anchor="middle">AI 네이티브 팀을 위한 컨트롤 플레인 · 오케스트레이터와 에이전트를 한곳에서</text>

  <!-- primary CTA -->
  <rect x="472" y="490" width="256" height="52" rx="12" fill="url(#run-brand)"/>
  <path d="M516 508 h6 v20 h-6 z M524 512 l14 6 l-14 6 z" fill="#0a0a0b"/>
  <text x="556" y="523" fill="#0a0a0b" font-size="17" font-weight="700">시작하기</text>

  <!-- secondary hint -->
  <text x="600" y="586" fill="#71717a" font-size="14" text-anchor="middle">다음 단계에서 에이전트 CLI에 로그인만 하면 됩니다</text>

  <!-- version pill -->
  <rect x="1080" y="700" width="96" height="26" rx="13" fill="#141416" stroke="#27272a"/>
  <circle cx="1098" cy="713" r="4" fill="#34d399"/>
  <text x="1110" y="717" fill="#a1a1aa" font-size="12">v3.0.13</text>
</svg>
