<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="pa-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="pa-glow" cx="0.62" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="1184" height="744" rx="14" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <clipPath id="pa-clip"><rect x="8" y="8" width="1184" height="744" rx="14"/></clipPath>
  <g clip-path="url(#pa-clip)">

    <!-- header -->
    <rect x="8" y="8" width="1184" height="48" fill="#0d1420"/>
    <line x1="8" y1="56" x2="1192" y2="56" stroke="#374151"/>
    <circle cx="34" cy="32" r="6" fill="#ff5f57"/><circle cx="56" cy="32" r="6" fill="#febc2e"/><circle cx="78" cy="32" r="6" fill="#28c840"/>
    <rect x="104" y="21" width="22" height="22" rx="6" fill="url(#pa-mark)"/>
    <circle cx="115" cy="32" r="4.5" fill="#0d1420"/>
    <text x="136" y="38" fill="#ffffff" font-size="16" font-weight="700">Marblo</text>
    <text x="202" y="38" fill="#6b7280" font-size="11">v3</text>
    <!-- project selector (center) -->
    <rect x="500" y="18" width="200" height="28" rx="8" fill="#1f2937" stroke="#374151"/>
    <path d="M518 27 h14 v10 h-14 z M518 27 l3 -4 h4 l0 4" fill="none" stroke="#eab308" stroke-width="1.4"/>
    <text x="540" y="37" fill="#e5e7eb" font-size="13" font-weight="600">my-app</text>
    <path d="M676 29 l4 4 l4 -4" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="710" y="22" width="46" height="20" rx="10" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="733" y="36" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">FREE</text>
    <!-- right: avatar -->
    <text x="1090" y="37" fill="#9ca3af" font-size="12">🐛 Report</text>
    <circle cx="1168" cy="32" r="12" fill="#3b82f6"/>
    <text x="1168" y="36" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">D</text>

    <!-- tab bar -->
    <rect x="8" y="56" width="1184" height="36" fill="#0d1420"/>
    <line x1="8" y1="92" x2="1192" y2="92" stroke="#374151"/>
    <text x="40" y="78" fill="#9ca3af" font-size="12.5" font-weight="600">Guide</text>
    <text x="102" y="78" fill="#60a5fa" font-size="12.5" font-weight="600">Board</text>
    <rect x="96" y="90" width="42" height="2" fill="#3b82f6"/>
    <text x="164" y="78" fill="#9ca3af" font-size="12.5" font-weight="600">Lanes</text>
    <text x="224" y="78" fill="#9ca3af" font-size="12.5" font-weight="600">Missions</text>
    <text x="304" y="78" fill="#9ca3af" font-size="12.5" font-weight="600">Code</text>
    <text x="360" y="78" fill="#9ca3af" font-size="12.5" font-weight="600">Agents</text>
    <text x="428" y="78" fill="#9ca3af" font-size="12.5" font-weight="600">Usage</text>
    <text x="492" y="78" fill="#6b7280" font-size="12.5" font-weight="600">Settings</text>

    <!-- sidebar -->
    <rect x="8" y="92" width="252" height="660" fill="#1f2937"/>
    <line x1="260" y1="92" x2="260" y2="752" stroke="#374151"/>
    <!-- panel tab strip -->
    <text x="52" y="122" fill="#e5e7eb" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle">파일</text>
    <rect x="34" y="130" width="52" height="2" fill="#3b82f6"/>
    <text x="130" y="122" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle">명령어</text>
    <text x="210" y="122" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle">채팅</text>
    <line x1="8" y1="140" x2="260" y2="140" stroke="#374151"/>
    <!-- project path header -->
    <path d="M26 154 h11 v8 h-11 z M26 154 l2.5 -3 h3.5 l0 3" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="44" y="163" fill="#d1d5db" font-size="11" font-weight="600">my-app</text>
    <rect x="96" y="152" width="40" height="15" rx="4" fill="#4b5563" fill-opacity="0.4"/>
    <text x="116" y="163" fill="#9ca3af" font-size="9" font-weight="700" text-anchor="middle">ROOT</text>
    <g stroke="#6b7280" stroke-width="1.2" fill="none">
      <path d="M212 155 h10 v8 h-10 z"/><path d="M230 159 l3 -3 v6 z"/><path d="M244 155 v8 M240 159 h8"/>
    </g>
    <line x1="8" y1="176" x2="260" y2="176" stroke="#374151"/>

    <!-- file tree rows (row height 24, x indent 12/level) -->
    <!-- node_modules (collapsed) -->
    <path d="M30 197 l4 4 l-4 4" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M42 195 h12 v9 h-12 z M42 195 l3 -3.5 h4 l0 3.5" fill="#eab308"/>
    <text x="62" y="203" fill="#d1d5db" font-size="12.5">node_modules</text>
    <!-- src (expanded) -->
    <path d="M30 225 l4 -4 M30 217 l4 4" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
    <path d="M42 219 h12 v9 h-12 z M42 219 l3 -3.5 h4 l0 3.5" fill="#eab308"/>
    <text x="62" y="227" fill="#d1d5db" font-size="12.5">src</text>
    <!--   components (expanded) -->
    <path d="M44 249 l4 -4 M44 241 l4 4" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
    <path d="M56 243 h12 v9 h-12 z M56 243 l3 -3.5 h4 l0 3.5" fill="#eab308"/>
    <text x="76" y="251" fill="#d1d5db" font-size="12.5">components</text>
    <!--     Header.tsx (M) -->
    <text x="72" y="275" fill="#93c5fd" font-size="10" font-weight="700">TX</text>
    <text x="92" y="275" fill="#fb923c" font-size="12.5">Header.tsx</text>
    <text x="248" y="275" fill="#fb923c" font-size="10" font-weight="700" text-anchor="end">M</text>
    <!--     Sidebar.tsx (selected row) -->
    <rect x="8" y="284" width="252" height="22" fill="#2563eb" fill-opacity="0.3"/>
    <text x="72" y="299" fill="#93c5fd" font-size="10" font-weight="700">TX</text>
    <text x="92" y="299" fill="#ffffff" font-size="12.5">Sidebar.tsx</text>
    <!--   App.tsx (M) -->
    <text x="58" y="323" fill="#60a5fa" font-size="10" font-weight="700">TS</text>
    <text x="78" y="323" fill="#fb923c" font-size="12.5">App.tsx</text>
    <text x="248" y="323" fill="#fb923c" font-size="10" font-weight="700" text-anchor="end">M</text>
    <!--   index.ts -->
    <text x="58" y="347" fill="#60a5fa" font-size="10" font-weight="700">TS</text>
    <text x="78" y="347" fill="#d1d5db" font-size="12.5">index.ts</text>
    <!-- public (collapsed) -->
    <path d="M30 365 l4 4 l-4 4" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M42 363 h12 v9 h-12 z M42 363 l3 -3.5 h4 l0 3.5" fill="#eab308"/>
    <text x="62" y="371" fill="#d1d5db" font-size="12.5">public</text>
    <!-- package.json (A) -->
    <text x="44" y="395" fill="#eab308" font-size="10" font-weight="700">{}</text>
    <text x="64" y="395" fill="#4ade80" font-size="12.5">package.json</text>
    <text x="248" y="395" fill="#4ade80" font-size="10" font-weight="700" text-anchor="end">A</text>
    <!-- README.md -->
    <text x="44" y="419" fill="#9ca3af" font-size="10" font-weight="700">MD</text>
    <text x="64" y="419" fill="#d1d5db" font-size="12.5">README.md</text>
    <!-- globals.css -->
    <text x="48" y="443" fill="#c084fc" font-size="11" font-weight="700">#</text>
    <text x="64" y="443" fill="#d1d5db" font-size="12.5">globals.css</text>

    <!-- MAIN AREA: registration confirmation -->
    <rect x="260" y="92" width="932" height="660" fill="#111827"/>
    <rect x="260" y="92" width="932" height="660" fill="url(#pa-glow)"/>

    <!-- folder-check hero -->
    <g transform="translate(690,250)">
      <path d="M6 14 h30 l6 8 h48 a6 6 0 0 1 6 6 v50 a6 6 0 0 1 -6 6 h-84 a6 6 0 0 1 -6 -6 v-58 a6 6 0 0 1 6 -6 z" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="78" cy="66" r="20" fill="#22c55e"/>
      <path d="M69 66 l6 6 l12 -13" fill="none" stroke="#0d1420" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="726" y="400" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">프로젝트가 등록되었어요</text>
    <text x="726" y="436" fill="#9ca3af" font-size="16" text-anchor="middle">폴더만 선택하면 클릭 한 번 없이 등록됩니다</text>
    <!-- path pill -->
    <rect x="576" y="464" width="300" height="34" rx="8" fill="#1f2937" stroke="#374151"/>
    <path d="M596 476 h10 v8 h-10 z M596 476 l2.5 -3 h3.5 l0 3" fill="none" stroke="#eab308" stroke-width="1.3"/>
    <text x="616" y="486" fill="#a6adc8" font-size="13" font-family="ui-monospace, Menlo, monospace">~/dev/my-app</text>
    <!-- next hint chip -->
    <rect x="602" y="524" width="248" height="30" rx="15" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.3"/>
    <circle cx="622" cy="539" r="4" fill="#4ade80"/>
    <text x="636" y="544" fill="#86efac" font-size="12.5" font-weight="600">다음: 오케스트레이터가 자동 기동됩니다</text>

    <!-- toast top-right -->
    <rect x="960" y="112" width="212" height="46" rx="10" fill="#1f2937" stroke="#22c55e" stroke-opacity="0.4"/>
    <circle cx="984" cy="135" r="10" fill="#22c55e" fill-opacity="0.2"/>
    <path d="M979 135 l3.5 3.5 l6 -7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1004" y="131" fill="#e5e7eb" font-size="12.5" font-weight="600">프로젝트 등록 완료</text>
    <text x="1004" y="148" fill="#6b7280" font-size="11">my-app · 방금</text>
  </g>
</svg>
