<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Marblo start here tab mockup</title>
  <desc id="desc">Dark WorkspaceShell with the Start Here onboarding tab open.</desc>
  <defs><style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.xs{font-size:12px}.sm{font-size:14px}.md{font-size:16px}.xl{font-size:22px}.text{fill:#cdd6f4}.muted{fill:#a6adc8}.dim{fill:#7f849c}</style><symbol id="check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h6l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol></defs>
  <rect width="1440" height="900" fill="#111827"/><rect y="0" width="1440" height="48" fill="#1f2937"/><line x1="0" y1="48" x2="1440" y2="48" stroke="#374151"/><text x="88" y="29" class="ui sm" fill="#e5e7eb" font-weight="700">Marblo</text>
  <rect x="0" y="48" width="240" height="852" fill="#1f2937"/><line x1="240" y1="48" x2="240" y2="900" stroke="#374151"/><text x="20" y="72" class="ui xs" fill="#e5e7eb" font-weight="700">FILES</text><rect x="16" y="84" width="64" height="2" fill="#3b82f6"/><use href="#folder" x="20" y="114" width="18" height="18" color="#eab308"/><text x="48" y="128" class="ui xs" fill="#e5e7eb">marblo-web</text><text x="48" y="162" class="ui xs dim">src</text><text x="48" y="194" class="ui xs dim">public</text><text x="48" y="226" class="ui xs dim">mockups</text>
  <rect x="240" y="48" width="430" height="852" fill="#111827"/><rect x="240" y="48" width="430" height="34" fill="#1f2937"/><text x="256" y="70" class="ui xs dim" font-weight="700">TERMINALS</text><rect x="240" y="82" width="430" height="405" fill="#1e1e2e"/><text x="260" y="116" class="mono xs text">$ marblo setup</text><text x="260" y="146" class="mono xs" fill="#a6e3a1">OK install checks complete</text><text x="260" y="176" class="mono xs" fill="#89b4fa">Open Start Here for onboarding</text><rect x="240" y="487" width="430" height="4" fill="#374151"/><rect x="240" y="491" width="430" height="409" fill="#111827"/><text x="260" y="526" class="ui xs dim" font-weight="700">AGENT TABS</text><rect x="258" y="548" width="118" height="30" rx="6" fill="#374151"/><circle cx="276" cy="563" r="5" fill="#d97757"/><text x="290" y="568" class="ui xs" fill="#e5e7eb">Claude</text><rect x="386" y="548" width="94" height="30" rx="6" fill="#1f2937"/><circle cx="404" cy="563" r="5" fill="#10a37f"/><text x="418" y="568" class="ui xs muted">GPT</text>
  <rect x="670" y="48" width="4" height="852" fill="#374151"/><g transform="translate(674 48)"><rect width="734" height="852" fill="#111827"/><rect width="734" height="37" fill="#1f2937"/><line x1="0" y1="37" x2="734" y2="37" stroke="#374151"/><text x="18" y="24" class="ui xs" fill="#e5e7eb" font-weight="700">Start Here</text><rect x="14" y="35" width="70" height="2" fill="#3b82f6"/><text x="102" y="24" class="ui xs dim" font-weight="700">Board</text><text x="164" y="24" class="ui xs dim" font-weight="700">Agents</text><text x="226" y="24" class="ui xs dim" font-weight="700">Project</text>
    <rect x="0" y="37" width="734" height="815" fill="#111827"/><g transform="translate(128 96)"><text x="0" y="0" class="ui xl text" font-weight="700">Start Here</text><text x="0" y="28" class="ui sm muted">A resumable checklist for CLIs, sign-in, a project folder, and the first ticket.</text><rect x="0" y="56" width="520" height="6" rx="3" fill="#313244"/><rect x="0" y="56" width="260" height="6" rx="3" fill="#a6e3a1"/><text x="536" y="62" class="ui xs muted">2 / 4</text><rect x="0" y="82" width="126" height="30" rx="6" fill="none" stroke="#45475a"/><path d="M20 94l6 4-6 4z" fill="#cdd6f4"/><text x="36" y="102" class="ui xs text">Watch demo</text><rect x="138" y="82" width="94" height="30" rx="6" fill="none" stroke="#45475a"/><text x="162" y="102" class="ui xs text">Recheck</text>
      <g transform="translate(0 140)"><rect width="560" height="76" rx="8" fill="#181825" stroke="#313244"/><circle cx="30" cy="38" r="13" fill="#a6e3a1"/><use href="#check" x="20" y="28" width="20" height="20" color="#1e1e2e"/><text x="58" y="32" class="ui sm text" font-weight="700">Install required CLIs</text><rect x="206" y="18" width="44" height="18" rx="3" fill="#a6e3a1" opacity=".16"/><text x="216" y="31" class="ui xs" fill="#a6e3a1">Done</text><text x="58" y="56" class="ui xs dim">Marblo checks local CLI availability before spawning agents.</text></g>
      <g transform="translate(0 228)"><rect width="560" height="170" rx="8" fill="#181825" stroke="#89b4fa" stroke-opacity=".5"/><circle cx="30" cy="38" r="13" fill="#89b4fa"/><text x="26" y="43" class="ui xs" fill="#1e1e2e" font-weight="700">2</text><text x="58" y="32" class="ui sm text" font-weight="700">Authenticate one agent CLI</text><rect x="240" y="18" width="56" height="18" rx="3" fill="#89b4fa" opacity=".16"/><text x="250" y="31" class="ui xs" fill="#89b4fa">Current</text><text x="58" y="56" class="ui xs dim">Claude or Codex sign-in is enough to continue.</text><rect x="58" y="82" width="444" height="34" rx="6" fill="#111827" stroke="#313244"/><circle cx="78" cy="99" r="5" fill="#d97757"/><text x="94" y="104" class="ui xs text">Claude Code</text><text x="414" y="104" class="ui xs" fill="#a6e3a1">Ready</text><rect x="58" y="126" width="444" height="34" rx="6" fill="#111827" stroke="#313244"/><circle cx="78" cy="143" r="5" fill="#10a37f"/><text x="94" y="148" class="ui xs text">Codex</text><text x="408" y="148" class="ui xs" fill="#f9e2af">Sign in</text></g>
      <g transform="translate(0 410)"><rect width="560" height="76" rx="8" fill="#181825" fill-opacity=".6" stroke="#313244"/><circle cx="30" cy="38" r="13" fill="#313244"/><text x="26" y="43" class="ui xs dim" font-weight="700">3</text><text x="58" y="32" class="ui sm text" font-weight="700">Connect a project folder</text><text x="58" y="56" class="ui xs dim">Pick a local folder so FileTree, board, and agents share one workspace.</text></g>
      <g transform="translate(0 498)"><rect width="560" height="76" rx="8" fill="#181825" fill-opacity=".6" stroke="#313244"/><circle cx="30" cy="38" r="13" fill="#313244"/><text x="26" y="43" class="ui xs dim" font-weight="700">4</text><text x="58" y="32" class="ui sm text" font-weight="700">Create the first ticket</text><text x="58" y="56" class="ui xs dim">Route the first request to the orchestrator and watch agents claim tasks.</text></g>
    </g></g><rect x="1408" y="48" width="32" height="852" fill="#1f2937"/><line x1="1408" y1="48" x2="1408" y2="900" stroke="#313244"/>
