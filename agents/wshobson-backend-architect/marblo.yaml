schema_version: 1

id: wshobson-backend-architect
name: Backend Architect (wshobson)
type: agent
version: 0.1.0
status: active
description: Service-boundary and API design subagent — REST/GraphQL/gRPC contracts, microservice decomposition, event-driven and resilience patterns, and observability designed in before the first endpoint ships. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "백엔드 아키텍트 (wshobson)"
    description: "서비스 경계·API 설계 서브에이전트 — REST/GraphQL/gRPC 계약, 마이크로서비스 분해, 이벤트 기반·복원력 패턴, 첫 엔드포인트가 나가기 전에 설계되는 관측성. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/backend-development/agents
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: wshobson-backend-architect
  files:
    - backend-architect.md
  integrity:
    algorithm: sha256
    files:
      backend-architect.md: 66598cd9077472e0d9a3406ea46635d12766defac27f84090f93c1903bcd3da2

permissions:
  - repository:read
  - filesystem:read
  - filesystem:write
  - shell:exec
  - network:outbound

keywords:
  - backend
  - api
  - microservices
  - architecture
  - external

license: MIT
homepage: https://github.com/wshobson/agents
