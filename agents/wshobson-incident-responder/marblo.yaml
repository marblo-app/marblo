schema_version: 1

id: wshobson-incident-responder
name: Incident Responder (wshobson)
type: agent
version: 0.1.0
status: active
description: SRE incident-command subagent — first-five-minutes severity triage, blast-radius assessment, comms cadence, mitigation before root cause, and blameless post-mortem with error-budget accounting. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "인시던트 리스폰더 (wshobson)"
    description: "SRE 인시던트 커맨드 서브에이전트 — 초기 5분 심각도 분류, 파급범위 평가, 커뮤니케이션 주기, 근본원인보다 우선하는 완화조치, 에러버짓을 반영한 무결점 포스트모템. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/incident-response/agents
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: wshobson-incident-responder
  files:
    - incident-responder.md
  integrity:
    algorithm: sha256
    files:
      incident-responder.md: 756a20cea3657dc119c1616073d223a8aa102f591479151419228f6d54f101cc

permissions:
  - repository:read
  - filesystem:read
  - filesystem:write
  - shell:exec
  - network:outbound

keywords:
  - incident
  - sre
  - on-call
  - postmortem
  - external

license: MIT
homepage: https://github.com/wshobson/agents
