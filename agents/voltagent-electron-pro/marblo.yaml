schema_version: 1

id: voltagent-electron-pro
name: Electron Pro (VoltAgent)
type: agent
version: 0.1.0
status: active
description: Desktop-app subagent for Electron — main/renderer process boundaries, context isolation and IPC hardening, native OS integration, memory budgets, and signed cross-platform installers. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "일렉트론 프로 (VoltAgent)"
    description: "Electron 데스크톱 앱 전용 서브에이전트 — 메인/렌더러 프로세스 경계, 컨텍스트 격리 및 IPC 강화, 네이티브 OS 통합, 메모리 예산, 서명된 크로스플랫폼 인스톨러. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: VoltAgent
  tier: community
  url: https://github.com/VoltAgent

source:
  repository: https://github.com/VoltAgent/awesome-claude-code-subagents
  ref: 947b44ca0c58d606b084e9cb1a2389335b49278b
  path: categories/01-core-development
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: voltagent-electron-pro
  files:
    - electron-pro.md
  integrity:
    algorithm: sha256
    files:
      electron-pro.md: 64c460c0f4ff108718c46a0e109ddfff48b68748c454efe7234e98199bb99ecb

permissions:
  - filesystem:read
  - filesystem:write
  - shell:exec

keywords:
  - electron
  - desktop
  - ipc
  - code-signing
  - external

license: MIT
homepage: https://github.com/VoltAgent/awesome-claude-code-subagents
