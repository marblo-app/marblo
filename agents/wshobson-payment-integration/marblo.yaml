schema_version: 1

id: wshobson-payment-integration
name: Payment Integration (wshobson)
type: agent
version: 0.1.0
status: active
description: Payments subagent for Stripe, PayPal, and Square — checkout and subscription flows, webhook handling, idempotency, PCI-conscious data handling, and the refund/dispute/failure edge cases. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "결제 연동 (wshobson)"
    description: "Stripe·PayPal·Square용 결제 서브에이전트 — 체크아웃·구독 플로우, 웹훅 처리, 멱등성, PCI를 의식한 데이터 처리, 환불·분쟁·실패 엣지케이스. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/payment-processing/agents
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: wshobson-payment-integration
  files:
    - payment-integration.md
  integrity:
    algorithm: sha256
    files:
      payment-integration.md: 59d17b7c994db0579c46f286731880e2a16da59edde58fb4237915c05ab798fe

permissions:
  - repository:read
  - filesystem:read
  - filesystem:write
  - shell:exec
  - network:outbound

keywords:
  - payments
  - stripe
  - webhooks
  - billing
  - external

license: MIT
homepage: https://github.com/wshobson/agents
