schema_version: 1

id: wshobson-cloud-architect
name: Cloud Architect (wshobson)
type: agent
version: 0.1.0
status: active
description: Multi-cloud design subagent covering AWS/Azure/GCP/OCI — landing zones, IaC strategy, FinOps cost modelling, disaster recovery, and the serverless-vs-containers call. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "클라우드 아키텍트 (wshobson)"
    description: "AWS/Azure/GCP/OCI를 아우르는 멀티클라우드 설계 서브에이전트 — 랜딩존, IaC 전략, FinOps 비용 모델링, 재해복구, 서버리스 대 컨테이너 판단. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/cloud-infrastructure/agents
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: wshobson-cloud-architect
  files:
    - cloud-architect.md
  integrity:
    algorithm: sha256
    files:
      cloud-architect.md: 7546acd0995f8ac8372eb68b7c2caf2286bd0c433e0dd1649261f96d96755218

permissions:
  - repository:read
  - filesystem:read
  - filesystem:write
  - shell:exec
  - network:outbound

keywords:
  - cloud
  - aws
  - azure
  - gcp
  - finops
  - external

license: MIT
homepage: https://github.com/wshobson/agents
