schema_version: 1

id: wshobson-error-detective
name: Error Detective (wshobson)
type: agent
version: 0.1.0
status: active
description: Log-forensics subagent — regex extraction over log streams, cross-language stack-trace reading, error correlation across distributed services, and anomaly hunting in Elasticsearch or Splunk queries. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "에러 디텍티브 (wshobson)"
    description: "로그 포렌식 서브에이전트 — 로그 스트림에서 정규식 추출, 여러 언어에 걸친 스택트레이스 해독, 분산 서비스 간 에러 상관분석, Elasticsearch·Splunk 쿼리에서의 이상탐지. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/distributed-debugging/agents
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: wshobson-error-detective
  files:
    - error-detective.md
  integrity:
    algorithm: sha256
    files:
      error-detective.md: 00cbc167f550f8a421039aa7fc0e460498f8cd9d80e26bb77524067a49535296

permissions:
  - repository:read
  - filesystem:read
  - filesystem:write
  - shell:exec
  - network:outbound

keywords:
  - logs
  - observability
  - forensics
  - correlation
  - external

license: MIT
homepage: https://github.com/wshobson/agents
