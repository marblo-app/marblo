schema_version: 1

id: reviewer
name: Reviewer Agent
type: agent
version: 1.0.0
status: active
description: A dedicated review agent — claims review tickets, runs the code-review skill on each diff, and reports blocking findings before merge.

i18n:
  ko:
    name: 리뷰어 에이전트
    description: 리뷰 전담 에이전트 — 리뷰 티켓을 선점해 각 diff 에 code-review 스킬을 돌리고, 머지를 막아야 할 지적사항을 보고한다.

publisher:
  name: Marblo
  tier: official
  url: https://marblo.app

compatibility:
  harnesses:
    - claude-code
    - codex

# AGENT.md is a plain subagent definition, so the Store copies it straight out of
# this repo at the reviewed commit. `root` is an enum key the app maps to the
# harness subagents directory — the manifest never carries a path — and the digest
# below is what the bytes are checked against before anything lands on disk.
# README.md is repo documentation, not payload: it has no subagent frontmatter, so
# it is deliberately not installed into the agents tree.
install:
  kind: files
  root: claude-agents
  dest: reviewer
  files:
    - AGENT.md
  integrity:
    algorithm: sha256
    files:
      AGENT.md: 83d23b32d310601d73588c3cd79da9205972df83b232f166f77d918ce8db5a98

permissions:
  - repository:read

keywords:
  - agent
  - review
  - quality-gate

license: MIT
homepage: https://github.com/marblo-app/marblo/tree/main/agents/reviewer
