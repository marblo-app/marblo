schema_version: 1

id: voltagent-context-manager
name: Context Manager (VoltAgent)
type: agent
version: 0.1.0
status: active
description: Shared-state subagent for multi-agent runs — storing and retrieving project context, keeping several agents reading the same facts, and governing what is written back. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "컨텍스트 매니저 (VoltAgent)"
    description: "멀티 에이전트 실행을 위한 공유 상태 서브에이전트 — 프로젝트 컨텍스트를 저장·조회하고, 여러 에이전트가 같은 사실을 읽도록 유지하며, 무엇을 다시 기록할지 통제한다. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: VoltAgent
  tier: community
  url: https://github.com/VoltAgent

source:
  repository: https://github.com/VoltAgent/awesome-claude-code-subagents
  ref: 947b44ca0c58d606b084e9cb1a2389335b49278b
  path: categories/09-meta-orchestration
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: voltagent-context-manager
  files:
    - context-manager.md
  integrity:
    algorithm: sha256
    files:
      context-manager.md: 9c3c9a2a3f4c8509c15fe7cd39a60a7d7f266fbc86befc03220944777c488a9e

permissions:
  - filesystem:read
  - filesystem:write

keywords:
  - context
  - multi-agent
  - state
  - orchestration
  - external

license: MIT
homepage: https://github.com/VoltAgent/awesome-claude-code-subagents
