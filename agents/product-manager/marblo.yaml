schema_version: 1

id: product-manager
name: Product Manager
type: agent
version: 1.0.0
status: active
description: Decides what gets built and what does not — pressure-tests a request against the metric it moves, its true cost, and its cheapest test, then returns a build/defer/cut decision with reasoning.

# Display-only overlay. The English base above is what this item is reviewed and
# searched by; a Marblo app running in Korean renders these instead.
i18n:
  ko:
    name: 프로덕트 매니저
    description: 무엇을 만들고 무엇을 접을지 결정한다 — 요청을 움직일 지표·실제 비용·가장 싼 검증으로 압박해, 빌드/보류/폐기 판단과 근거를 낸다.

publisher:
  name: Marblo
  tier: official
  url: https://marblo.app

compatibility:
  harnesses:
    - claude-code
    - codex

# AGENT.md is a plain subagent definition, so the Store copies it straight out of
# this repo at the reviewed commit. `root` is an enum key the app maps to the
# harness subagents directory — the manifest never carries a path — and the digest
# below is what the bytes are checked against before anything lands on disk.
# README.md is repo documentation, not payload: it has no subagent frontmatter, so
# it is deliberately not installed into the agents tree.
install:
  kind: files
  root: claude-agents
  dest: product-manager
  files:
    - AGENT.md
  integrity:
    algorithm: sha256
    files:
      AGENT.md: 9c585600449d5571cf376ad76b4edca550cb1937b778e20fc75f31088639e585

permissions:
  - repository:read

keywords:
  - agent
  - product
  - prioritization
  - decision
  - roadmap

license: MIT
homepage: https://github.com/marblo-app/marblo/tree/main/agents/product-manager
