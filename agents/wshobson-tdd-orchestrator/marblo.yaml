schema_version: 1

id: wshobson-tdd-orchestrator
name: TDD Orchestrator (wshobson)
type: agent
version: 0.1.0
status: active
description: Enforcement subagent for red-green-refactor across a team — test-first compliance checking, cycle-time measurement, coverage governance, and coordination of multiple agents working the same TDD flow. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "TDD 오케스트레이터 (wshobson)"
    description: "팀 전체의 red-green-refactor를 강제하는 서브에이전트 — 테스트 우선 준수 확인, 사이클타임 측정, 커버리지 거버넌스, 같은 TDD 흐름에서 일하는 여러 에이전트 조율. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/tdd-workflows/agents
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: wshobson-tdd-orchestrator
  files:
    - tdd-orchestrator.md
  integrity:
    algorithm: sha256
    files:
      tdd-orchestrator.md: a670b704b4b2625db0624a4263721f60feb698fb407b5a298624282d0bc6b49d

permissions:
  - repository:read
  - filesystem:read
  - filesystem:write
  - shell:exec
  - network:outbound

keywords:
  - tdd
  - testing
  - governance
  - orchestration
  - external

license: MIT
homepage: https://github.com/wshobson/agents
