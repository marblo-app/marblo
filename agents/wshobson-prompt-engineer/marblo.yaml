schema_version: 1

id: wshobson-prompt-engineer
name: Prompt Engineer (wshobson)
type: agent
version: 0.1.0
status: active
description: Prompt-design subagent — chain-of-thought and few-shot construction, constitutional patterns, system-prompt authoring, and evaluation of prompt changes against production behaviour. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "프롬프트 엔지니어 (wshobson)"
    description: "프롬프트 설계 서브에이전트 — 사고사슬(chain-of-thought)·퓨샷 구성, 컨스티튜셔널 패턴, 시스템 프롬프트 작성, 프로덕션 동작 대비 프롬프트 변경 평가. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/llm-application-dev/agents
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: wshobson-prompt-engineer
  files:
    - prompt-engineer.md
  integrity:
    algorithm: sha256
    files:
      prompt-engineer.md: d9e8033c62fac5d2abd93845c6163b9a37bbf547b9e4ceb74edba3d469597313

permissions:
  - repository:read
  - filesystem:read
  - filesystem:write
  - shell:exec
  - network:outbound

keywords:
  - prompting
  - llm
  - system-prompt
  - evaluation
  - external

