  ko:
    name: "DevOps 트러블슈터 (wshobson)"
    description: "프로덕션 디버깅을 위한 인시던트 대응 서브에이전트 — 로그 분석, 분산 트레이싱, Kubernetes·컨테이너 장애, 근본원인 보고서 작성. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
