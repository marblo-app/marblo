schema_version: 1

id: wshobson-devops-troubleshooter
name: DevOps Troubleshooter (wshobson)
type: agent
version: 0.1.0
status: active
description: Incident-response subagent for production debugging — log analysis, distributed tracing, Kubernetes and container failures, and root-cause write-ups. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "DevOps 트러블슈터 (wshobson)"
    description: "프로덕션 디버깅을 위한 인시던트 대응 서브에이전트 — 로그 분석, 분산 트레이싱, Kubernetes·컨테이너 장애, 근본원인 보고서 작성. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/cicd-automation/agents
compatibility:
  harnesses:
    - claude-code
    - codex

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-agents
  dest: wshobson-devops-troubleshooter
  files:
    - devops-troubleshooter.md
  integrity:
    algorithm: sha256
    files:
      devops-troubleshooter.md: 7dded0f01b0cf7290a7ee2885750b440c984c79782e80a6193a918b4a808cf85

permissions:
  - repository:read
  - filesystem:read
  - shell:exec
  - network:outbound

keywords:
  - devops
  - incident
  - observability
  - kubernetes
  - external

license: MIT
homepage: https://github.com/wshobson/agents
