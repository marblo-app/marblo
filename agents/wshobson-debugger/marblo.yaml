schema_version: 1

id: wshobson-debugger
name: Debugger (wshobson)
type: agent
version: 0.1.0
status: active
description: Compact root-cause subagent for errors, test failures, and unexpected behaviour — capture the trace, isolate the failure, form and test a hypothesis, apply the minimal fix, verify. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "디버거 (wshobson)"
    description: "오류·테스트 실패·예상치 못한 동작을 위한 소형 근본원인 서브에이전트 — 트레이스 수집, 실패 격리, 가설 수립·검증, 최소 수정 적용, 검증. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Seth Hobson (wshobson)
  tier: community
  url: https://github.com/wshobson

# Manifest-only: upstream publishes no release tags, so the pin is a 40-hex SHA.
source:
  repository: https://github.com/wshobson/agents
  ref: c4b82b0ad771190355eb8e204b1329732a18449a
  path: plugins/debugging-toolkit/agents/debugger.md

compatibility:
  harnesses:
    - claude-code
    - codex

permissions:
  - repository:read
  - filesystem:read
  - filesystem:write
  - shell:exec
  - network:outbound

keywords:
  - debugging
  - root-cause
  - test-failure
  - triage
  - external

license: MIT
homepage: https://github.com/wshobson/agents
