schema_version: 1

id: code-review
name: Code Review
type: skill
version: 1.0.0
status: active
description: Review agent-generated code for correctness, security, and simplicity before it merges.

# Display-only overlay. The English base above is what this item is reviewed and
# searched by; a Marblo app running in Korean renders these instead.
i18n:
  ko:
    name: 코드 리뷰
    description: 에이전트가 만든 코드를 머지 전에 정확성·보안·단순성 관점으로 리뷰한다.

publisher:
  name: Marblo
  tier: official
  url: https://marblo.app

compatibility:
  harnesses:
    - claude-code
    - codex

# The payload lives in this repo, so the Store copies it directly at the reviewed
# commit — no upstream fetch, no archive extraction. `root` is an enum key the app
# maps to ~/.claude/skills; the manifest never sees a path. The digests below are
# what the app checks the bytes against before anything lands on disk.
install:
  kind: files
  root: claude-skills
  dest: code-review
  files:
    - SKILL.md
    - README.md
  integrity:
    algorithm: sha256
    files:
      SKILL.md: c8b984fb630bdfb1510729d16fb6ebb7aabab44f04da0f7d69f4c49dc2c1bec7
      README.md: d1a2f7575dc81251ef2e81ac244b808ad7234246c9faf4b5a6a2c5604b228587

permissions:
  - repository:read

keywords:
  - review
  - quality
  - merge-gate
  - security

license: MIT
homepage: https://marblo.app
