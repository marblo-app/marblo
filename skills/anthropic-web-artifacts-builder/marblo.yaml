schema_version: 1

id: anthropic-web-artifacts-builder
name: Web Artifacts Builder (Anthropic)
type: skill
version: 0.1.0
status: active
description: Scaffolds a Vite + React + Tailwind + shadcn/ui project and bundles it back down to one self-contained HTML file. For multi-component artifacts that need state and routing. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "웹 아티팩트 빌더 (Anthropic)"
    description: "Vite + React + Tailwind + shadcn/ui 프로젝트를 스캐폴딩하고 하나의 독립 HTML 파일로 번들링한다. 상태·라우팅이 필요한 멀티 컴포넌트 아티팩트용. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
