schema_version: 1

id: opendesign-taste-skill
name: Taste Skill by Leonxlnx (OpenDesign bundle)
type: skill
version: 0.22.2
status: active
description: Leonxlnx's MIT anti-slop frontend skill for landing pages, portfolios and redesigns, pinned from the OpenDesign v0.22.2 bundle with its LICENSE. Installs to ~/.claude/skills for Claude Code; running it uses your model quota. No API keys. Not vendored.

i18n:
  ko:
    name: "테이스트 스킬 — Leonxlnx (OpenDesign 번들)"
    description: "Leonxlnx가 만든 MIT 라이선스 안티-슬롭 프론트엔드 스킬(랜딩·포트폴리오·리디자인). OpenDesign v0.22.2 번들본을 LICENSE와 함께 고정. Claude Code용 ~/.claude/skills에 설치되며, 실행하면 사용 중인 모델 사용량이 소모됨. API 키 불필요. 벤더링되지 않음."

# The publisher is the repository the bytes come from. The skill itself is
# Leonxlnx's work (https://github.com/Leonxlnx/taste-skill, MIT); OpenDesign
# ships a copy of it with the same LICENSE file beside SKILL.md, which is why
# this item pins OpenDesign rather than the original repo — the original keeps
# LICENSE at its root, outside the directory an install can copy from.
publisher:
  name: OpenDesign (nexu-io)
  tier: community
  url: https://github.com/nexu-io

# Manifest-only: the real files stay upstream, pinned to a commit SHA.
# 73953213… is the target of release tag open-design-v0.22.2; that tag name does
# not fit the ref pattern, so the pin is the 40-hex SHA.
source:
  repository: https://github.com/nexu-io/open-design
  ref: 73953213a6fec2c8092e8e77d229a3074aa828a9
  path: skills/taste-skill

compatibility:
  harnesses:
    - claude-code

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-skills
  dest: opendesign-taste-skill
  files:
    - LICENSE
    - SKILL.md
  integrity:
    algorithm: sha256
    files:
      LICENSE: 4575a543ab88dad12ccea7d97e563d0bce5b448b06072e65d3264497dad326df
      SKILL.md: 10bfcad7c488585c9dbe332c082f0ef7896e0516ae8768b6ec2194f70e97a656

permissions:
  - filesystem:read
  - filesystem:write

keywords:
  - frontend
  - design
  - landing-page
  - ui
  - opendesign
  - external

license: MIT
homepage: https://github.com/nexu-io/open-design/tree/73953213a6fec2c8092e8e77d229a3074aa828a9/skills/taste-skill
