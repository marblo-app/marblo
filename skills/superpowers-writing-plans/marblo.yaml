schema_version: 1

id: superpowers-writing-plans
name: Writing Plans (Superpowers)
type: skill
version: 6.2.0
status: active
description: Turns an approved spec into a bite-sized implementation plan written for an engineer with zero context — file-by-file decomposition, per-task tests, and frequent commits. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "계획 작성 (Superpowers)"
    description: "승인된 스펙을 컨텍스트가 전혀 없는 엔지니어를 위한 잘게 쪼갠 구현 계획으로 바꾼다 — 파일 단위 분해, 태스크별 테스트, 잦은 커밋. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Jesse Vincent (obra)
  tier: community
  url: https://github.com/obra

source:
  repository: https://github.com/obra/superpowers
  ref: v6.2.0
  path: skills/writing-plans

compatibility:
  harnesses:
    - claude-code
    - codex
    - any

# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-skills
  dest: superpowers-writing-plans
  files:
    - SKILL.md
    - plan-document-reviewer-prompt.md
  integrity:
    algorithm: sha256
    files:
      SKILL.md: 72190c88b2b5a67a96b91d66aa72b9161913e10e8769da3f28a226f4cc7b99d0
      plan-document-reviewer-prompt.md: aa728b96aad603c8be28875a4305637f6c984aa81ffcadcb13e743202fa2a0c7

permissions:
  - repository:read
  - filesystem:write

keywords:
  - planning
  - decomposition
  - tdd
  - handoff
  - external

license: MIT
homepage: https://github.com/obra/superpowers/tree/main/skills/writing-plans
