schema_version: 1

id: korean-skills
name: Korean Writing Skills (한국어 글쓰기 3종)
type: skill
version: 0.1.0
status: active
description: Three prompt-only skills for Korean prose — rewrite machine-sounding AI text into natural Korean, proofread against 국립국어원 orthography rules, and apply a consistent Korean style guide.

i18n:
  ko:
    name: 한국어 글쓰기 스킬 3종
    description: 한국어 글을 다듬는 프롬프트 전용 스킬 3종 — AI 티 나는 문장을 자연스러운 한국어로 고쳐 쓰고, 국립국어원 어문규범 기준으로 맞춤법을 교정하며, 일관된 한국어 문체 가이드를 적용한다.

publisher:
  name: DaleSeo
  tier: community
  url: https://github.com/DaleSeo

