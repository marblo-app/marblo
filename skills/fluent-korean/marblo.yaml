schema_version: 1

id: fluent-korean
name: fluent-korean (Korean output style)
type: skill
version: 0.1.0
status: active
description: A Claude Code output-style that stops the agent writing broken machine-Korean — dropped particles and endings, telegraphic noun strings, metaphor-swapped vocabulary. Install it when your agents report, hand off, or produce deliverables in Korean.

i18n:
  ko:
    name: fluent-korean (한국어 출력 스타일)
    description: 에이전트가 조사·어미가 빠진 번역투 한국어, 명사 나열, 뜻이 어긋난 비유 표현을 쓰지 않도록 잡아주는 Claude Code 출력 스타일. 보고·인계·산출물이 한국어로 오갈 때 설치한다.

publisher:
  name: snflkd
  tier: community
  url: https://github.com/snflkd

# Manifest-only: pinned to the upstream release tag v1.0.0
# (resolves to commit 3c1073a629eead3bd3ffc1ec7e47824b21be6d6d).
source:
  repository: https://github.com/snflkd/fluent-korean
  ref: v1.0.0
  path: plugins/fluent-korean

compatibility:
  harnesses:
    - claude-code

# Output-style markdown only: no scripts, no file access, no network.
# Not vendored: the app copies these files from the pinned `source` ref above,
# checking every byte against the digests below before anything lands on disk.
# Generated by scripts/gen-community-installs.mjs — regenerate, don't hand-edit.
install:
  kind: files
  root: claude-skills
  dest: fluent-korean
  files:
    - output-styles/fluent-korean-not-coding.md
    - output-styles/fluent-korean.md
  integrity:
    algorithm: sha256
    files:
      output-styles/fluent-korean-not-coding.md: 28bd76fa65d748ece9a7c1ce3cbc71129284d511a3a4f20ed81027d8c6425645
      output-styles/fluent-korean.md: 0db63cd63f2d6422b35fbb6c319e6470e268f26019bd91868b96eb9c3cec1d4a

permissions: []

keywords:
  - korea
  - korean
  - output-style
  - writing
  - localization
  - external

license: MIT
homepage: https://github.com/snflkd/fluent-korean
