description: Anthropic's guidance for giving new UI a deliberate visual identity — aesthetic direction, typography, and palette choices that do not read as templated defaults. Referenced by manifest; not vendored.

i18n:
  ko:
    name: "프론트엔드 디자인 (Anthropic)"
