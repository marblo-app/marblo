schema_version: 1

id: linear-mcp
name: Linear MCP (tacticlaunch)
type: mcp-server
version: 1.4.1
status: active
description: Reads and writes Linear from the agent — issues, comments, projects, cycles, and status transitions — over Linear's GraphQL API with a personal token. Referenced by manifest; not vendored.

i18n:
  ko:
    description: "개인 토큰으로 Linear의 GraphQL API를 통해 에이전트에서 Linear를 읽고 쓴다 — 이슈, 댓글, 프로젝트, 사이클, 상태 전환. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: tacticlaunch
  tier: community
  url: https://github.com/tacticlaunch

# Manifest-only: the real code stays upstream, pinned to an immutable release
# tag. v1.4.1 (2026-07-28) matches npm @tacticlaunch/mcp-linear@1.4.1.
source:
  repository: https://github.com/tacticlaunch/mcp-linear
  ref: v1.4.1

compatibility:
  harnesses:
    - claude-code
    - codex
    - any

# Writes are in scope: the server creates and updates issues and comments with
# whatever the personal token allows.
permissions:
  - network:outbound
  - secrets:read

keywords:
  - linear
  - issue-tracker
  - project-management
  - planning
  - external

license: MIT
homepage: https://github.com/tacticlaunch/mcp-linear
