schema_version: 1

id: clickhouse-mcp
name: ClickHouse MCP
type: mcp-server
version: 0.4.1
status: active
description: ClickHouse's official server — run SELECT queries against a ClickHouse cluster (read-only by default), list databases and tables, and optionally query local files through embedded chDB. Referenced by manifest; not vendored.

i18n:
  ko:
    description: "ClickHouse 공식 서버 — ClickHouse 클러스터에 SELECT 쿼리 실행(기본 읽기전용), 데이터베이스·테이블 목록 조회, 내장 chDB로 로컬 파일도 선택적으로 쿼리. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: ClickHouse
  tier: community
  url: https://github.com/ClickHouse

# Manifest-only: the real code stays upstream, pinned to a released tag.
source:
  repository: https://github.com/ClickHouse/mcp-clickhouse
  ref: v0.4.1

compatibility:
  harnesses:
    - claude-code
    - codex
    - any

# filesystem:read covers the optional chDB mode, which queries local data files
# in-process; the default ClickHouse-only mode does not touch disk.
permissions:
  - network:outbound
  - secrets:read
  - filesystem:read

keywords:
  - clickhouse
  - olap
  - sql
  - analytics
  - database
  - external

license: Apache-2.0
homepage: https://github.com/ClickHouse/mcp-clickhouse
