schema_version: 1

id: atlassian-mcp
name: MCP Atlassian
type: mcp-server
version: 0.23.0
status: active
description: Reads and writes Jira issues and Confluence pages from the agent, against both Atlassian Cloud and Server/Data Center deployments. Referenced by manifest; not vendored.

i18n:
  ko:
    description: "Atlassian Cloud와 Server/Data Center 배포 모두를 대상으로 에이전트에서 Jira 이슈와 Confluence 페이지를 읽고 쓴다. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: sooperset
  tier: community
  url: https://github.com/sooperset

# Manifest-only: the real code stays upstream, pinned to a released tag.
source:
  repository: https://github.com/sooperset/mcp-atlassian
  ref: v0.23.0

compatibility:
  harnesses:
    - claude-code
    - codex
    - any

permissions:
  - network:outbound
  - secrets:read

keywords:
  - jira
  - confluence
  - atlassian
  - issue-tracking
  - external

license: MIT
homepage: https://github.com/sooperset/mcp-atlassian
