schema_version: 1

id: clickup-mcp
name: ClickUp MCP
type: mcp-server
version: 1.6.2
status: active
description: Searches, creates, and updates ClickUp tasks from the agent, plus comments and time tracking, with a read-only mode for workspaces that should not be written to. Referenced by manifest; not vendored.

i18n:
  ko:
    description: "에이전트에서 ClickUp 태스크를 검색·생성·수정하고 댓글·시간추적까지 다룬다. 쓰기가 금지돼야 할 워크스페이스를 위한 읽기전용 모드 제공. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: hauptsache.net
  tier: community
  url: https://github.com/hauptsacheNet

# Manifest-only: the real code stays upstream, pinned to a released tag.
# Note: package.json at v1.6.2 still reads 1.6.1 — upstream tagged without
# bumping. `version` above tracks the pinned ref, which is what installs.
source:
  repository: https://github.com/hauptsacheNet/clickup-mcp
  ref: v1.6.2

compatibility:
  harnesses:
    - claude-code
    - codex
    - any

permissions:
  - network:outbound
  - secrets:read

keywords:
  - clickup
  - project-management
  - tasks
  - time-tracking
  - external

license: MIT
homepage: https://github.com/hauptsacheNet/clickup-mcp
