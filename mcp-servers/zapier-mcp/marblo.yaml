schema_version: 1

id: zapier-mcp
name: Zapier MCP
type: mcp-server
version: 1.0.0
status: active
description: Reaches thousands of SaaS apps through Zapier's hosted MCP endpoint over OAuth. The server is remote; the pinned repo is Zapier's official client-side plugin. Referenced by manifest; not vendored.

i18n:
  ko:
    description: "OAuth를 통해 Zapier의 호스팅 MCP 엔드포인트로 수천 개의 SaaS 앱에 접근한다. 서버 자체는 원격이며, 고정된 저장소는 Zapier의 공식 클라이언트 측 플러그인이다. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Zapier
  tier: community
  url: https://github.com/zapier

# Manifest-only, and read the README before this pin is taken at face value: the
# MCP server itself is HOSTED at https://mcp.zapier.com/api/v1/connect and has no
# public source. What is pinned here is Zapier's official plugin distribution —
# the client-side skills, agents, and `gemini-extension.json` that point at that
# endpoint. Upstream cuts no tags, so the head commit is pinned; `version` is the
# plugin version from gemini-extension.json at that commit.
source:
  repository: https://github.com/zapier/zapier-mcp
  ref: e672a7bd0d4ef125f4b81fde1c4369a95348ba46

compatibility:
  harnesses:
    - claude-code
    - codex
    - gemini-cli
    - any

# OAuth against the hosted endpoint rather than a static token: no API-key env var
# is required, but the negotiated credential is still read from the client's store.
permissions:
  - network:outbound
  - secrets:read

keywords:
  - zapier
  - automation
  - integrations
  - workflows
  - external

license: MIT
homepage: https://github.com/zapier/zapier-mcp
