schema_version: 1

id: figma-context-mcp
name: Framelink Figma MCP
type: mcp-server
version: 0.13.2
status: active
description: Turns a Figma frame into the layout data a coding agent can actually use, instead of asking it to reimplement a design from a screenshot. Referenced by manifest; not vendored.

i18n:
  ko:
    description: "Figma 프레임을 코딩 에이전트가 실제로 쓸 수 있는 레이아웃 데이터로 변환한다 — 스크린샷만 보고 디자인을 재구현하라고 시키는 대신. 매니페스트로 참조되며 벤더링되지 않음."

publisher:
  name: Framelink (GLips)
  tier: community
  url: https://github.com/GLips

# Manifest-only: the real code stays upstream, pinned to a released tag.
source:
  repository: https://github.com/GLips/Figma-Context-MCP
  ref: v0.13.2

compatibility:
  harnesses:
    - claude-code
    - codex
    - any

permissions:
  - network:outbound
  - secrets:read

keywords:
  - figma
  - design
  - ui
  - frontend
  - external

license: MIT
homepage: https://github.com/GLips/Figma-Context-MCP
